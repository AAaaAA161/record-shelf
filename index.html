<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Deine Musiksammlung mit Tidal-Integration">
    <meta name="theme-color" content="#d4845f">
    <title>Record Shelf</title>
    <!-- 
        Record Shelf v1.5.0 - GitHub Pages Edition
        Features: IndexedDB storage, Storage Persistence API, Options page, Export/Import backups, cards layout, dropdown menu
        
        NEU in v1.5.0 (Optik):
        - Schreibschrift nur noch im Logo, Kategorien in Inter
        - Cover ohne Kartenbox, flachere Flächen ohne Schatten
        - Neutrale Platzhalter mit Initialen statt bunter Verläufe
        - Zufallsalben mit unscharfem Cover als Hintergrund

        NEU in v1.4.9:
        - 🐛 Knöpfe oben ragen am Handy nicht mehr über den Rand
        - "CSV importieren" ist jetzt im Optionen-Menü
        - Albumtitel zweizeilig, Genre ändern über ✎ auf dem Cover
        - Besser lesbare Zahlen (Statistik, Anzahl pro Genre/Kategorie)
        - 🎲 Zufallsalben oben neu würfeln

        NEU in v1.4.8:
        - 🗂️ Kategorie pro Genre wählbar (im Genre-Dialog), z. B. "Hard bop" → Traditional & Roots
        - Gilt für alle Alben mit diesem Genre, bleibt bei Import und im Backup erhalten

        NEU in v1.4.7:
        - ✎ Genre von Hand ändern: Tipp auf das Genre-Schild eines Albums
        - Gilt für alle Alben des Künstlers, bleibt bei CSV-Import und Neuladen erhalten
        - Korrekturen sind im Backup enthalten

        NEU in v1.4.6:
        - 🐛 Zufall pro Kategorie nimmt nur noch Alben dieser Kategorie (auch "Other")
        - 🐛 "Neue CSV laden" löscht die Sammlung erst, wenn der neue Import fertig ist
        - ⚡ CSV-Import lädt nur neue Alben (und fehlende Genres/Cover) von Last.fm
        - 🛡️ Last.fm gedrosselt, mit automatischer Wiederholung bei Fehlern
        - ✅ Rückmeldung nach "Backup erstellen"
        - 🧹 Ungenutzten Code entfernt

        NEU in v1.4.5:
        - 🧹 PWA-Code entfernt (Manifest, Service Worker, Install-Prompt)
        - 🧹 Netlify-Reste entfernt (package.json, Deployment-Anleitung)

        NEU in v1.4.4:
        - 🔧 CSV-Parsing-Fix: Unterstützt jetzt Tidal Export Format!
        - ✅ Flexible Spaltennamen: "Album", "Artist name", "Tidal - id"
        - 🎯 Zero-Config: Tidal CSV funktioniert ohne Änderungen
        - 🐛 Regression-Fix: Tidal öffnet wieder Alben statt Suche
        
        NEU in v1.4.3:
        - 🎲 Random-Alben-Fix: Korrekte uniforme Zufallsauswahl
        - ❌ Bias entfernt: Alle Alben haben jetzt gleiche Chance
        - ⚡ Performance: 1000x schneller (direkte Auswahl statt Shuffle)
        - 🐛 Bug gefunden durch User-Feedback!
        
        NEU in v1.4.2:
        - 🧹 Code-Optimierung: 43 Zeilen entfernt (~1.5% kleiner)
        - ❌ Ungenutztes CSS entfernt (settings-btn)
        - ❌ Redundante console.logs entfernt (von 34 auf 15 reduziert)
        - ❌ Unnötige !important Flags entfernt
        - ✨ Saubererer, wartbarer Code
        
        NEU in v1.4.1:
        - 🔄 Menü-Konsolidierung: Backup & Einstellungen in einem "Optionen" Dropdown
        - 📱 Touch Events Fix: Drag & Drop funktioniert jetzt in Firefox/Android
        - ✨ Nur 2 Buttons: Besseres Layout auf kleinen Screens
        
        NEU in v1.4.0:
        - ⚙️ Einstellungen-Seite mit Kategorie-Sortierung
        - Drag & Drop: Hauptkategorien umsortieren
        - Persistierung der Kategorie-Reihenfolge in IndexedDB
        - Versionsnummer im Footer auf allen Seiten
        
        NEU in v1.3.2.3:
        - Mobile Polish: Random Alben kleiner (max 100px)
        - Mobile Polish: Akkordions kompakter (kleinere Schrift, weniger Padding)
        - Mobile Polish: Text-Umbrüche verhindert (nowrap)
        - Mobile Polish: Abstände reduziert (10px statt 16px)
        
        NEU in v1.3.2.2:
        - Mobile Layout Fix: Buttons horizontal aligned
        - Mobile Layout Fix: Random Alben gleich groß
        - Mobile Layout Fix: Album-Grid immer 2 Spalten
        
        NEU in v1.3.2.1:
        - Storage Persistence API (fragt um Erlaubnis, Daten dauerhaft zu speichern)
        - Hilft gegen automatisches Löschen in Brave & anderen Privacy-Browsern
        
        NEU in v1.3.2:
        - IndexedDB statt localStorage (robuster, persistenter)
        - Automatisches Laden aus IndexedDB
        - JSON Import füllt IndexedDB automatisch

    -->
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
:root {
            --bg-primary: #1f2128;
            --bg-secondary: #2a2d3a;
            --bg-card: #363944;
            --bg-card-hover: #3f4350;
            --text-primary: #ffffff;
            --text-secondary: #9ca3bf;
            --accent: #d4845f;
            --accent-dark: #c07653;
            --border: #3a3f5f;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
            --shadow-lg: 0 10px 40px rgba(0, 0, 0, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
        }

        #app {
            max-width: 1400px;
            margin: 0 auto;
            padding: 30px 20px;
        }

        h1 {
            font-family: 'Pacifico', cursive;
            font-size: 3rem;
            font-weight: 400;
            text-align: center;
            margin-top: 0.5rem;
            margin-bottom: 0.5rem;
            letter-spacing: 1px;
            color: var(--text-primary);
        }

        .subtitle {
            font-family: 'Inter', sans-serif;
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
            font-weight: 400;
            letter-spacing: 0.5px;
        }

        /* Upload Screen */
        .upload-container {
            text-align: center;
            padding: 40px 20px 80px;
            animation: fadeIn 0.6s ease-out;
        }

        /* Modern Cards Layout */
        .upload-cards-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(450px, 1fr));
            gap: 30px;
            padding: 40px 20px;
            max-width: 1200px;
            margin: 0 auto;
            animation: fadeIn 0.6s ease-out;
        }

        @media (max-width: 1000px) {
            .upload-cards-container {
                grid-template-columns: 1fr;
                max-width: 600px;
            }
        }

        .upload-card {
            background: var(--bg-secondary);
            border-radius: 20px;
            padding: 30px;
            border: 1px solid var(--border);
            transition: all 0.3s ease;
        }

        .upload-card:hover {
            border-color: var(--accent);
            transform: translateY(-4px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
        }

        .upload-card-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .upload-card-icon {
            font-size: 3rem;
            margin-bottom: 15px;
            opacity: 0.8;
        }

        .upload-card h2 {
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-primary);
        }

        .upload-card-header p {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        .backup-restore-area {
            text-align: center;
            padding: 30px 20px;
        }

        .backup-icon {
            font-size: 4rem;
            opacity: 0.5;
            margin-bottom: 20px;
        }

        .backup-restore-btn {
            background: linear-gradient(135deg, rgba(100, 150, 255, 0.2), rgba(100, 150, 255, 0.1));
            color: rgba(100, 150, 255, 1);
            border: 2px solid rgba(100, 150, 255, 0.3);
            padding: 16px 36px;
            font-size: 1.05rem;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(100, 150, 255, 0.1);
        }

        .backup-restore-btn:hover {
            background: linear-gradient(135deg, rgba(100, 150, 255, 0.3), rgba(100, 150, 255, 0.2));
            border-color: rgba(100, 150, 255, 0.5);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(100, 150, 255, 0.2);
        }

        .upload-area {
            background: var(--bg-card);
            border: 2px dashed var(--border);
            border-radius: 16px;
            padding: 40px 30px;
            transition: all 0.3s ease;
            cursor: pointer;
            margin-bottom: 20px;
        }

        .upload-area:hover, .upload-area.dragging {
            border-color: var(--accent);
            background: var(--bg-card-hover);
            transform: scale(1.02);
        }

        .upload-icon {
            font-size: 2.5rem;
            margin-bottom: 15px;
            opacity: 0.5;
        }

        .upload-text {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .upload-hint {
            color: var(--text-secondary);
            font-size: 0.85rem;
            margin-bottom: 20px;
        }

        .upload-btn {
            background: var(--accent);
            color: var(--bg-primary);
            border: none;
            padding: 14px 32px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: var(--shadow);
        }

        .upload-btn:hover {
            background: var(--accent-dark);
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        .file-input {
            display: none;
        }

        .csv-example {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 12px;
            padding: 20px;
            text-align: left;
        }

        .csv-example h3 {
            font-size: 0.95rem;
            margin-bottom: 12px;
            font-weight: 600;
            opacity: 0.8;
        }

        .csv-example code {
            display: block;
            background: var(--bg-primary);
            padding: 20px;
            border-radius: 10px;
            font-family: 'SF Mono', 'Monaco', 'Consolas', monospace;
            font-size: 0.9rem;
            line-height: 1.8;
            color: var(--accent);
            margin: 10px 0;
        }

        .csv-example p {
            font-size: 0.9rem;
            line-height: 1.6;
            color: var(--text-secondary);
        }

        /* Stats */
        .stats {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-item {
            background: transparent;
            padding: 0;
            text-align: center;
            transition: opacity 0.2s ease;
        }

        .stat-item:hover {
            opacity: 1;
        }

        .stat-number {
            display: inline;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-right: 4px;
        }

        .stat-label {
            display: inline;
            color: var(--text-secondary);
            font-size: 0.75rem;
            font-weight: 400;
        }

        /* Button Container */
        .button-container {
            text-align: center;
            margin-bottom: 30px;
            display: flex;
            gap: 10px;
            justify-content: center;
            align-items: center;
            flex-wrap: nowrap;
            padding: 0 10px;
        }

        @media (max-width: 768px) {
            .button-container {
                gap: 8px;
            }
            
            .button-container .reset-btn,
            .button-container .backup-dropdown-btn {
                padding: 12px 16px;
                font-size: 0.9rem;
                white-space: nowrap;
            }
        }

        /* Reset Button */
        .reset-btn {
            background: var(--bg-secondary);
            color: var(--text-primary);
            border: 1px solid var(--border);
            padding: 14px 32px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .reset-btn:hover {
            background: var(--bg-card);
            border-color: var(--accent);
            transform: translateY(-2px);
        }

        .export-btn, .import-btn {
            background: var(--bg-secondary);
            color: var(--text-primary);
            border: 1px solid var(--border);
            padding: 14px 32px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .export-btn:hover {
            background: rgba(107, 207, 143, 0.1);
            border-color: rgba(107, 207, 143, 0.5);
            transform: translateY(-2px);
        }

        .import-btn:hover {
            background: rgba(100, 150, 255, 0.1);
            border-color: rgba(100, 150, 255, 0.5);
            transform: translateY(-2px);
        }

        /* Dropdown Menu for Backup */
        .backup-dropdown {
            position: relative;
            display: inline-block;
        }

        .backup-dropdown-btn {
            background: var(--bg-secondary);
            color: var(--text-primary);
            border: 1px solid var(--border);
            padding: 14px 32px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .backup-dropdown-btn:hover {
            background: var(--bg-card);
            border-color: var(--accent);
            transform: translateY(-2px);
        }

        .dropdown-arrow {
            font-size: 0.8rem;
            transition: transform 0.2s ease;
        }

        .backup-dropdown-btn:hover .dropdown-arrow {
            transform: translateY(2px);
        }

        .backup-dropdown-menu {
            position: absolute;
            top: calc(100% + 8px);
            left: 50%;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            min-width: 280px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            opacity: 0;
            visibility: hidden;
            transform: translate(-50%, -10px);
            transition: all 0.2s ease;
            z-index: 1000;
            overflow: hidden;
        }

        .backup-dropdown-menu.show {
            opacity: 1;
            visibility: visible;
            transform: translate(-50%, 0);
        }

        .backup-dropdown-menu button {
            width: 100%;
            background: none;
            border: none;
            padding: 16px 20px;
            text-align: left;
            cursor: pointer;
            transition: background 0.2s ease;
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--text-primary);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .backup-dropdown-menu button:last-of-type {
            border-bottom: none;
        }

        .backup-dropdown-menu button:hover {
            background: var(--bg-card-hover);
        }

        .menu-icon {
            font-size: 1.5rem;
            opacity: 0.8;
        }

        .menu-title {
            font-weight: 600;
            font-size: 0.95rem;
            margin-bottom: 2px;
        }

        .menu-desc {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .menu-info {
            padding: 12px 20px;
            background: rgba(0, 0, 0, 0.2);
            font-size: 0.8rem;
            color: var(--text-secondary);
            text-align: center;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Settings Button */
        /* Settings Screen */
        .settings-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        .settings-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .settings-header h1 {
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .settings-section {
            background: var(--bg-secondary);
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 30px;
        }

        .settings-section h2 {
            font-size: 1.3rem;
            margin-bottom: 10px;
        }

        .settings-section p {
            color: var(--text-secondary);
            margin-bottom: 20px;
            font-size: 0.95rem;
        }

        .category-list {
            list-style: none;
            padding: 0;
        }

        .category-item {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px 20px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 16px;
            cursor: move;
            user-select: none;
            transition: all 0.2s ease;
        }

        .category-item:hover {
            background: var(--bg-card-hover);
            transform: translateX(4px);
        }

        .category-item.dragging {
            opacity: 0.5;
        }

        .drag-handle {
            font-size: 1.5rem;
            color: var(--text-secondary);
            cursor: grab;
        }

        .drag-handle:active {
            cursor: grabbing;
        }

        .category-item-content {
            flex: 1;
            font-size: 1.1rem;
            font-weight: 500;
        }

        .settings-actions {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .settings-actions button {
            padding: 14px 32px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            border: none;
        }

        .btn-primary {
            background: var(--accent);
            color: var(--bg-primary);
        }

        .btn-primary:hover {
            background: var(--accent-dark);
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: var(--bg-secondary);
            color: var(--text-primary);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background: var(--bg-card);
            border-color: var(--accent);
        }

        @media (max-width: 768px) {
            .settings-btn {
                padding: 12px 16px;
                font-size: 0.9rem;
            }

            .settings-container {
                padding: 16px;
            }

            .settings-section {
                padding: 20px;
            }

            .category-item {
                padding: 12px 16px;
            }

            .category-item-content {
                font-size: 1rem;
            }
        }

        /* Random Albums Showcase */
        .random-albums-container {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin: 0 auto;
            max-width: 600px;
            padding: 0 20px;
        }

        .random-album-item {
            flex: 0 0 calc(33.333% - 8px);
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .random-album-cover {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
        }

        .random-album-title {
            margin-top: 6px;
            font-size: 0.8rem;
            font-weight: 500;
            text-align: center;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .random-album-artist {
            font-size: 0.7rem;
            color: var(--text-secondary);
            text-align: center;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        @media (max-width: 768px) {
            .random-albums-container {
                gap: 10px;
                padding: 0 16px;
            }

            .random-album-item {
                flex: 1 1 0;
                min-width: 0;
            }

            .random-album-title {
                font-size: 0.7rem;
                margin-top: 4px;
            }

            .random-album-artist {
                font-size: 0.65rem;
            }
        }

        .random-reroll {
            display: flex;
            justify-content: center;
            margin-top: 16px;
        }

        .random-hero {
            position: relative;
            isolation: isolate;
            overflow: hidden;
            max-width: 640px;
            margin: 10px auto 36px;
            padding: 28px 0 20px;
            border-radius: 20px;
        }

        .random-hero::before {
            content: '';
            position: absolute;
            inset: -40px;
            background: var(--hero-bg) center / cover;
            filter: blur(40px) saturate(1.4);
            opacity: 0.5;
            z-index: -2;
        }

        .random-hero::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, rgba(31, 33, 40, 0.1), var(--bg-primary));
            z-index: -1;
        }

        /* Main Category Sections */
        .main-category-section {
            margin-bottom: 40px;
        }

        .main-category-header {
            background: transparent;
            padding: 16px 0;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            user-select: none;
        }

        .main-category-title {
            font-family: 'Inter', sans-serif;
            font-size: 1.3rem;
            font-weight: 600;
            letter-spacing: -0.01em;
        }

        .main-category-count {
            background: transparent;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 500;
            color: var(--text-secondary);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .shuffle-btn {
            background: var(--bg-secondary);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 1.2rem;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .shuffle-btn:hover {
            background: var(--bg-card);
            transform: rotate(180deg);
        }

        .shuffle-btn:active {
            transform: rotate(180deg) scale(0.95);
        }

        .genre-shuffle-btn {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: white;
            font-size: 1rem;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0.7;
        }

        .genre-shuffle-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: rotate(180deg);
            opacity: 1;
            border-color: rgba(255, 255, 255, 0.3);
        }

        .genre-shuffle-btn:active {
            transform: rotate(180deg) scale(0.95);
        }

        .main-category-content {
            /* Always visible - no accordion behavior */
        }

        /* Genre Sections */
        .genre-section {
            margin-bottom: 16px;
        }

        .genre-header {
            background: var(--bg-secondary);
            padding: 16px 20px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
            user-select: none;

<body>
    <div class="container">
        <header>
            <h1>Record Shelf</h1>
            <p class="subtitle">Meine Musiksammlung mit intelligenter Genre-Organisation</p>
        </header>

        <div id="app"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script>
        const APP_VERSION = '1.5.0';

        class AlbumLibraryApp {
            constructor() {
                // Last.fm API Key (Browser-App: Key ist im Quelltext sichtbar)
                this.LASTFM_API_KEY = 'c791b2900db01345232549f0bb64b168';
                
                this.albums = [];
                this.genreCache = new Map();
                this.genreOverrides = {}; // artist (lowercase) -> genre chosen by hand
                this.categoryOverrides = {}; // genre (lowercase) -> main category chosen by hand
                this.genreMapping = this.createGenreMapping();
                this.genreColors = this.createGenreColors();
                this.mainCategories = this.createMainCategories();
                
                // Default category order
                this.categoryOrder = [
                    '🤘 Metal',
                    '🎸 Rock & Alternative',
                    '🔮 Experimental',
                    '🎧 Electronic & Synth',
                    '🎤 Pop',
                    '🎵 Urban',
                    '🎺 Traditional & Roots',
                    '🌍 World'
                ];
            }

            createMainCategories() {
                return {
                    '🤘 Metal': {
                        genres: ['metal', 'heavy metal', 'death metal', 'black metal', 'thrash metal', 
                                'doom metal', 'progressive metal', 'power metal', 'metalcore', 'nu metal',
                                'breakcore', 'cybergrind', 'deathcore', 'grindcore', 'screamo',
                                'drone', 'drone metal'],
                        color: 'rgba(80, 80, 80, 0.7)',
                        order: 1
                    },
                    '🎸 Rock & Alternative': {
                        genres: ['rock', 'punk', 'alternative', 'alternative rock', 'indie', 'indie rock', 
                                'grunge', 'shoegaze', 'post-punk', 'post-rock', 'noise rock', 'lo-fi', 'emo',
                                'hamburger schule', 'post-hardcore', 'sludge', 'slowcore', 'riot grrrl'],
                        color: 'rgba(212, 132, 95, 0.5)',
                        order: 2
                    },
                    '🔮 Experimental': {
                        genres: ['experimental', 'avant-garde', 'noise', 'sound art', 'psychedelic'],
                        color: 'rgba(120, 120, 130, 0.5)',
                        order: 3
                    },
                    '🎧 Electronic & Synth': {
                        genres: ['electronic', 'synth-pop', 'synthpop', 'techno', 'house', 'ambient', 
                                'edm', 'electronica', 'idm', 'downtempo', 'trip-hop', 'drum and bass', 
                                'dubstep', 'trance', 'synthwave', 'electro', 'industrial', 'glitch', 'vaporwave',
                                'minimal synth', 'minimal', 'electroclash'],
                        color: 'rgba(120, 150, 180, 0.5)',
                        order: 4
                    },
                    '🎤 Pop': {
                        genres: ['pop', 'indie pop', 'dream pop', 'art pop', 'electropop', 'dance-pop', 
                                'pop rock', 'power pop', 'chamber pop', 'baroque pop', 'singer-songwriter',
                                'liedermacher'],
                        color: 'rgba(198, 120, 141, 0.5)',
                        order: 5
                    },
                    '🎵 Urban': {
                        genres: ['hip hop', 'r&b', 'rap', 'trap', 'soul', 'neo-soul',
                                'experimental hip hop', 'instrumental hip-hop'],
                        color: 'rgba(180, 140, 120, 0.5)',
                        order: 6
                    },
                    '🎺 Traditional & Roots': {
                        genres: ['jazz', 'blues', 'folk', 'indie folk', 'country', 'classical', 'reggae', 'funk',
                                'acoustic', 'piano', 'trumpet'],
                        color: 'rgba(200, 160, 100, 0.5)',
                        order: 7
                    },
                    '🌍 World': {
                        genres: ['world', 'afrobeat', 'latin', 'bossa nova', 'flamenco', 'throat singing',
                                'africa', 'balkan', 'first nations', 'germany'],
                        color: 'rgba(130, 150, 140, 0.5)',
                        order: 8
                    }
                };
            }

            getMainCategory(genre, useOverrides = true) {
                const lowerGenre = genre.toLowerCase();

                // Category chosen by hand wins
                if (useOverrides && this.categoryOverrides[lowerGenre]) {
                    return this.categoryOverrides[lowerGenre];
                }
                
                // Sort categories by order before checking
                const sortedCategories = Object.entries(this.mainCategories)
                    .sort((a, b) => (a[1].order || 999) - (b[1].order || 999));
                
                // Only use exact match - no substring matching
                // This prevents false matches like "alternative" matching with "experimental"
                for (const [category, data] of sortedCategories) {
                    if (data.genres.some(g => g === lowerGenre)) {
                        return category;
                    }
                }
                
                // Fallback: Smart keyword matching for common suffixes/prefixes
                // Only match if genre ENDS with or CONTAINS the keyword as a whole word
                const keywordMappings = {
                    '🤘 Metal': ['metal'],
                    '🎸 Rock & Alternative': ['rock', 'punk', 'core'], // hardcore, metalcore, etc.
                    '🎧 Electronic & Synth': ['techno', 'house', 'trance', 'wave'],
                    '🎤 Pop': ['pop'],
                    '🎵 Urban': ['hop', 'rap', 'r&b'],
                    '🎺 Traditional & Roots': ['jazz', 'blues', 'folk', 'country'],
                    '🌍 World': ['world', 'latin', 'african']
                };
                
                for (const [category, keywords] of Object.entries(keywordMappings)) {
                    for (const keyword of keywords) {
                        // Check if genre ends with keyword or contains it as whole word
                        if (lowerGenre.endsWith(keyword) || 
                            lowerGenre.includes(' ' + keyword) || 
                            lowerGenre.includes(keyword + ' ')) {
                            return category;
                        }
                    }
                }
                
                return '🎵 Other';
            }

            createGenreColors() {
                return {
                    'rock': 'rgba(212, 132, 95, 0.4)',
                    'pop': 'rgba(198, 120, 141, 0.4)',
                    'synth-pop': 'rgba(168, 120, 180, 0.4)',
                    'synthpop': 'rgba(168, 120, 180, 0.4)',
                    'electronic': 'rgba(120, 150, 180, 0.4)',
                    'hip hop': 'rgba(180, 140, 120, 0.4)',
                    'jazz': 'rgba(200, 160, 100, 0.4)',
                    'folk': 'rgba(140, 160, 120, 0.4)',
                    'r&b': 'rgba(190, 130, 110, 0.4)',
                    'punk': 'rgba(180, 100, 90, 0.4)',
                    'country': 'rgba(170, 140, 100, 0.4)',
                    'classical': 'rgba(150, 130, 160, 0.4)',
                    'reggae': 'rgba(160, 150, 90, 0.4)',
                    'blues': 'rgba(100, 130, 150, 0.4)',
                    'world': 'rgba(130, 150, 140, 0.4)',
                    'experimental': 'rgba(120, 120, 130, 0.4)',
                    'alternative': 'rgba(140, 150, 150, 0.4)',
                    'indie': 'rgba(150, 160, 140, 0.4)',
                    // All metal genres = dark warm
                    'metal': 'rgba(80, 80, 80, 0.6)',
                    'heavy metal': 'rgba(80, 80, 80, 0.6)',
                    'death metal': 'rgba(70, 70, 70, 0.6)',
                    'black metal': 'rgba(60, 60, 60, 0.6)',
                    'thrash metal': 'rgba(90, 80, 70, 0.6)',
                    'doom metal': 'rgba(75, 75, 75, 0.6)',
                    'progressive metal': 'rgba(85, 85, 85, 0.6)',
                    'power metal': 'rgba(90, 85, 80, 0.6)',
                    'metalcore': 'rgba(80, 75, 75, 0.6)',
                    'nu metal': 'rgba(85, 80, 75, 0.6)',
                    'default': 'rgba(212, 132, 95, 0.4)'
                };
            }

            getGenreColor(genre) {
                const lowerGenre = genre.toLowerCase();
                return this.genreColors[lowerGenre] || this.genreColors['default'];
            }

            createGenreMapping() {
                return {
                    // Rock and variants (excluding indie/alternative rock and post-rock - those stay separate)
                    'rock': ['rock', 'classic rock', 'hard rock', 'soft rock', 
                             'garage rock', 'psychedelic rock', 'progressive rock', 'art rock',
                             'folk rock', 'blues rock', 'southern rock', 'glam rock', 'arena rock'],
                    
                    // Pop
                    'pop': ['pop', 'indie pop', 'dream pop', 'art pop', 'electropop', 
                            'dance-pop', 'pop rock', 'power pop', 'chamber pop', 'baroque pop'],
                    
                    // Electronic
                    'electronic': ['electronic', 'techno', 'house', 'ambient', 'edm', 'electronica', 
                                   'idm', 'downtempo', 'trip-hop', 'drum and bass', 'dubstep', 'trance',
                                   'synthwave', 'electro', 'industrial', 'glitch'],
                    
                    // Hip Hop
                    'hip hop': ['hip hop', 'hip-hop', 'rap', 'trap', 'conscious hip hop', 'gangsta rap',
                                'east coast hip hop', 'west coast hip hop', 'underground hip hop'],
                    
                    // Jazz
                    'jazz': ['jazz', 'bebop', 'cool jazz', 'free jazz', 'hard bop', 'modal jazz',
                             'jazz fusion', 'smooth jazz', 'contemporary jazz', 'avant-garde jazz'],
                    
                    // Folk
                    'folk': ['folk', 'indie folk', 'contemporary folk', 'freak folk', 'neo-folk', 'anti-folk', 'americana'],
                    
                    // R&B and Soul
                    'r&b': ['r&b', 'rnb', 'soul', 'neo-soul', 'contemporary r&b', 'motown'],
                    
                    // Punk (excluding post-punk - that's more alternative)
                    'punk': ['punk', 'punk rock', 'hardcore punk', 'pop punk',
                             'ska punk', 'crust punk', 'anarcho-punk'],
                    
                    // Country
                    'country': ['country', 'country rock', 'alt-country', 'outlaw country'],
                    
                    // Classical
                    'classical': ['classical', 'baroque', 'romantic', 'contemporary classical',
                                  'minimalism', 'opera', 'orchestral'],
                    
                    // Reggae
                    'reggae': ['reggae', 'dub', 'dancehall', 'roots reggae', 'ska'],
                    
                    // Blues
                    'blues': ['blues', 'delta blues', 'chicago blues', 'electric blues'],
                    
                    // World
                    'world': ['world', 'world music', 'afrobeat', 'latin', 'bossa nova', 'flamenco'],
                    
                    // Experimental
                    'experimental': ['experimental', 'avant-garde', 'noise', 'sound art']
                    
                    // Metal genres kept separate: heavy metal, death metal, black metal, etc.
                    // Alternative/Indie genres kept separate: indie, indie rock, alternative rock, shoegaze, grunge, post-punk, etc.
                };
            }

            mapGenre(originalGenre) {
                if (!originalGenre) return 'Unknown';
                
                const lowerGenre = originalGenre.toLowerCase().trim();
                
                // Only use exact match - no substring matching
                // This prevents "post-punk" from being mapped to "punk"
                for (const [mainGenre, subGenres] of Object.entries(this.genreMapping)) {
                    if (subGenres.some(sub => sub === lowerGenre)) {
                        return mainGenre.charAt(0).toUpperCase() + mainGenre.slice(1);
                    }
                }
                
                // If no exact match found, return original but capitalize
                return originalGenre.charAt(0).toUpperCase() + originalGenre.slice(1);
            }

            artistKey(artist) {
                return (artist || '').toLowerCase().trim();
            }

            applyGenreOverrides(albums) {
                albums.forEach(album => {
                    const genre = this.genreOverrides[this.artistKey(album.artist)];
                    if (genre) album.genre = genre;
                });
            }

            async init() {
                // Request persistent storage (wichtig für Brave & Privacy-Browser)
                await this.requestPersistentStorage();
                
                this.showLoading('Lade gespeicherte Alben...');
                
                try {
                    // Try to load from IndexedDB
                    const savedAlbums = await this.loadFromIndexedDB();
                    
                    if (savedAlbums && savedAlbums.length > 0) {
                        this.albums = savedAlbums;
                        
                        // Re-map genres in case the mapping has changed
                        this.albums.forEach(album => {
                            if (album.genre) {
                                const oldGenre = album.genre;
                                album.genre = this.mapGenre(oldGenre);
                            }
                        });
                        this.applyGenreOverrides(this.albums);
                        
                        // Save updated genres back to IndexedDB
                        await this.saveToIndexedDB();
                        
                        this.renderAlbumsByGenre();
                    } else {
                        this.showUploadScreen();
                    }
                } catch (error) {
                    console.error('Fehler beim Laden:', error);
                    this.showUploadScreen();
                }
            }

            // IndexedDB Helper Methods
            async openDB() {
                return new Promise((resolve, reject) => {
                    const request = indexedDB.open('RecordShelfDB', 1);
                    
                    request.onerror = () => reject(request.error);
                    request.onsuccess = () => resolve(request.result);
                    
                    request.onupgradeneeded = (event) => {
                        const db = event.target.result;
                        if (!db.objectStoreNames.contains('albums')) {
                            db.createObjectStore('albums', { keyPath: 'id' });
                        }
                    };
                });
            }

            async loadFromIndexedDB() {
                try {
                    const db = await this.openDB();
                    const transaction = db.transaction(['albums'], 'readonly');
                    const store = transaction.objectStore('albums');
                    const request = store.get('albumLibrary');
                    
                    return new Promise((resolve, reject) => {
                        request.onsuccess = () => {
                            if (request.result) {
                                // Load categoryOrder if available
                                if (request.result.categoryOrder) {
                                    this.categoryOrder = request.result.categoryOrder;
                                }
                                this.genreOverrides = request.result.genreOverrides || {};
                                this.categoryOverrides = request.result.categoryOverrides || {};
                                resolve(request.result.albums || null);
                            } else {
                                resolve(null);
                            }
                        };
                        request.onerror = () => {
                            console.error('Fehler beim Laden aus IndexedDB:', request.error);
                            reject(request.error);
                        };
                    });
                } catch (error) {
                    console.error('Fehler beim Öffnen der IndexedDB:', error);
                    return null;
                }
            }

            async saveToIndexedDB() {
                try {
                    const db = await this.openDB();
                    const transaction = db.transaction(['albums'], 'readwrite');
                    const store = transaction.objectStore('albums');
                    
                    const data = {
                        id: 'albumLibrary',
                        albums: this.albums,
                        categoryOrder: this.categoryOrder,
                        genreOverrides: this.genreOverrides,
                        categoryOverrides: this.categoryOverrides,
                        savedAt: new Date().toISOString()
                    };
                    
                    store.put(data);
                    
                    return new Promise((resolve, reject) => {
                        transaction.oncomplete = () => {
                            resolve();
                        };
                        transaction.onerror = () => {
                            console.error('Fehler beim Speichern in IndexedDB:', transaction.error);
                            reject(transaction.error);
                        };
                    });
                } catch (error) {
                    console.error('Fehler beim Speichern in IndexedDB:', error);
                }
            }

            async requestPersistentStorage() {
                if (navigator.storage && navigator.storage.persist) {
                    try {
                        // Check if already granted
                        const isPersisted = await navigator.storage.persisted();
                        
                        if (isPersisted) {
                            return true;
                        }
                        
                        // Request persistence
                        const granted = await navigator.storage.persist();
                        
                        if (granted) {
                            console.log('✅ Persistent Storage aktiviert! Daten bleiben erhalten.');
                        } else {
                            console.log('⚠️ Persistent Storage nicht gewährt. Browser könnte Daten löschen.');
                        }
                        
                        return granted;
                    } catch (error) {
                        console.error('Fehler bei Storage Persistence Request:', error);
                        return false;
                    }
                } else {
                    console.log('ℹ️ Storage Persistence API nicht verfügbar (älterer Browser)');
                    return false;
                }
            }

            showUploadScreen() {

            setupDragAndDrop() {
                const list = document.getElementById('categoryList');
                const items = list.querySelectorAll('.category-item');
                let draggedElement = null;
                let touchY = 0;

                items.forEach(item => {
                    // Desktop: HTML5 Drag & Drop
                    item.addEventListener('dragstart', (e) => {
                        draggedElement = item;
                        item.classList.add('dragging');
                    });

                    item.addEventListener('dragend', (e) => {
                        item.classList.remove('dragging');
                    });

                    item.addEventListener('dragover', (e) => {
                        e.preventDefault();
                        const afterElement = this.getDragAfterElement(list, e.clientY);
                        if (afterElement == null) {
                            list.appendChild(draggedElement);
                        } else {
                            list.insertBefore(draggedElement, afterElement);
                        }
                    });

                    // Mobile: Touch Events
                    item.addEventListener('touchstart', (e) => {
                        draggedElement = item;
                        touchY = e.touches[0].clientY;
                        item.classList.add('dragging');
                        item.style.opacity = '0.5';
                    }, { passive: false });

                    item.addEventListener('touchmove', (e) => {
                        e.preventDefault();
                        touchY = e.touches[0].clientY;
                        
                        const afterElement = this.getDragAfterElement(list, touchY);
                        if (afterElement == null) {
                            list.appendChild(draggedElement);
                        } else {
                            list.insertBefore(draggedElement, afterElement);
                        }
                    }, { passive: false });

                    item.addEventListener('touchend', (e) => {
                        item.classList.remove('dragging');
                        item.style.opacity = '1';
                        draggedElement = null;
                    });
                });
            }

            getDragAfterElement(container, y) {
                const draggableElements = [...container.querySelectorAll('.category-item:not(.dragging)')];

                return draggableElements.reduce((closest, child) => {
                    const box = child.getBoundingClientRect();
                    const offset = y - box.top - box.height / 2;

                    if (offset < 0 && offset > closest.offset) {
                        return { offset: offset, element: child };
                    } else {
                        return closest;
                    }
                }, { offset: Number.NEGATIVE_INFINITY }).element;
            }

            handleFile(file) {
                if (!file.name.endsWith('.csv')) {
                    this.showError('Bitte wähle eine CSV-Datei aus.');
                    return;
                }

                this.showLoading();

                Papa.parse(file, {
                    header: true,
                    skipEmptyLines: true,
                    complete: (results) => {
                        this.processCSV(results.data);
                    },
                    error: (error) => {
                        this.showError('Fehler beim Lesen der CSV: ' + error.message);
                    }
                });
            }

            processCSV(data) {
                if (data.length === 0) {
                    this.showError('Die CSV-Datei ist leer.');
                    return;
                }

                // Helper function to get value from row with flexible column names
                const getColumnValue = (row, ...possibleNames) => {
                    for (const name of possibleNames) {
                        if (row[name] !== undefined && row[name] !== null && row[name] !== '') {
                            return row[name];
                        }
                    }
                    return null;
                };

                // Check for required columns (flexible matching)
                const firstRow = data[0];
                const albumValue = getColumnValue(firstRow, 'Album', 'album', 'ALBUM');
                const artistValue = getColumnValue(firstRow, 'Artist name', 'Artist', 'artist', 'ARTIST', 'Artist Name');
                
                if (!albumValue || !artistValue) {
                    this.showError('Die CSV muss Album- und Künstler-Spalten enthalten.');
                    return;
                }

                const imported = data.filter(row => {
                    const album = getColumnValue(row, 'Album', 'album', 'ALBUM');
                    const artist = getColumnValue(row, 'Artist name', 'Artist', 'artist', 'ARTIST', 'Artist Name');
                    return album && artist;
                }).map(row => {
                    const album = {
                        album: getColumnValue(row, 'Album', 'album', 'ALBUM'),
                        artist: getColumnValue(row, 'Artist name', 'Artist', 'artist', 'ARTIST', 'Artist Name')
                    };
                    
                    // Check for optional tidal_id or tidal_url column (flexible matching)
                    const tidalId = getColumnValue(row, 'Tidal - id', 'Tidal-id', 'tidal_id', 'tidal-id', 'Tidal_id', 'Tidal_ID', 'TIDAL_ID', 'tidalId', 'TidalId');
                    const tidalUrl = getColumnValue(row, 'Tidal - url', 'Tidal-url', 'tidal_url', 'tidal-url', 'Tidal_url', 'TIDAL_URL', 'tidalUrl', 'TidalUrl');
                    
                    if (tidalId) {
                        album.tidalId = tidalId;
                    } else if (tidalUrl) {
                        // Extract ID from URL like https://tidal.com/album/123456
                        const match = tidalUrl.match(/album[\/:](\d+)/);
                        if (match) {
                            album.tidalId = match[1];
                        }
                    }
                    
                    return album;
                });

                // Keep genre and cover of albums that are already in the library
                const albumKey = a => `${a.artist}|${a.album}`.toLowerCase().trim();
                const known = new Map(this.albums.map(a => [albumKey(a), a]));
                imported.forEach(album => {
                    const old = known.get(albumKey(album));
                    if (old) {
                        if (old.genre && old.genre !== 'Unknown') album.genre = old.genre;
                        if (old.coverUrl) album.coverUrl = old.coverUrl;
                    }
                });
                this.applyGenreOverrides(imported);

                this.showLoading('Lade Genres und Cover...');
                this.loadAllAlbumData(imported);
            }

            async loadAllAlbumData(imported) {
                try {
                    // Only albums with missing genre or cover need Last.fm
                    const todo = imported.filter(a => !a.genre || a.genre === 'Unknown' || !a.coverUrl);
                    const total = todo.length;
                    const batchSize = 2; // Last.fm allows about 5 requests per second
                    const delayBetweenBatches = 500;
                    
                    let processed = 0;
                    
                    for (let i = 0; i < todo.length; i += batchSize) {
                        const batch = todo.slice(i, i + batchSize);
                        
                        await Promise.all(batch.map(async (album) => {
                            if (!album.genre || album.genre === 'Unknown') {
                                album.genre = await this.fetchGenreFromLastFM(album.artist);
                            }
                            if (!album.coverUrl) {
                                album.coverUrl = await this.fetchAlbumCover(album.album, album.artist);
                            }
                            processed++;
                            this.showLoading(`Lade Album-Daten von Last.fm...`, processed, total);
                        }));
                        
                        if (i + batchSize < todo.length) {
                            await this.sleep(delayBetweenBatches);
                        }
                    }

                    // Replace the library only after everything is loaded
                    this.albums = imported;
                    await this.saveToIndexedDB();
                    
                    // Auto-create backup after successful import
                    this.autoExportBackup();
                    
                    // Now render grouped by genre
                    this.renderAlbumsByGenre();
                } catch (error) {
                    console.error('Fehler beim Laden der Daten:', error);
                    this.showError('Fehler beim Laden der Daten: ' + error.message);
                }
            }

                };

                const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `record-shelf-backup-${new Date().toISOString().split('T')[0]}.json`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);

                localStorage.setItem('lastBackupDate', new Date().toISOString());
            }

            getLastBackupInfo(compact = false) {

                if (!lastBackup) {

                        : `<div style="text-align: center; margin-bottom: 20px; color: rgba(255,255,255,0.5); font-size: 0.85rem;">
                            💡 Tipp: Erstelle regelmäßig Backups
                          </div>`;
                }

                const date = new Date(lastBackup);
                const now = new Date();
                const diffDays = Math.floor((now - date) / (1000 * 60 * 60 * 24));
                
                let timeText;
                if (diffDays === 0) {
                    timeText = 'heute';
                } else if (diffDays === 1) {
                    timeText = 'gestern';
                } else if (diffDays < 7) {
                    timeText = `vor ${diffDays} Tagen`;
                } else if (diffDays < 30) {
                    const weeks = Math.floor(diffDays / 7);
                    timeText = `vor ${weeks} Woche${weeks > 1 ? 'n' : ''}`;
                } else {
                    const months = Math.floor(diffDays / 30);
                    timeText = `vor ${months} Monat${months > 1 ? 'en' : ''}`;
                }

                const emoji = diffDays > 30 ? '⚠️' : '✅';
                
                return compact
                    ? `${emoji} Letztes: ${timeText}`
                    : `<div style="text-align: center; margin-bottom: 20px; color: rgba(255,255,255,0.6); font-size: 0.85rem;">

            // Last.fm request with up to 3 attempts on network errors,
            // rate limits (29) and temporary errors (8, 11, 16)
            async lastfmRequest(params) {
                const query = new URLSearchParams({ ...params, api_key: this.LASTFM_API_KEY, format: 'json' });
                const url = `https://ws.audioscrobbler.com/2.0/?${query}`;
                for (let attempt = 1; ; attempt++) {
                    try {
                        const response = await fetch(url);
                        const data = await response.json();
                        if ([8, 11, 16, 29].includes(data.error)) {
                            throw new Error(`Last.fm Fehler ${data.error}: ${data.message}`);
                        }
                        return data;
                    } catch (error) {
                        if (attempt === 3) throw error;
                        await this.sleep(2000 * attempt);
                    }
                }
            }

            async fetchAlbumCover(albumName, artistName) {
                try {
                    const data = await this.lastfmRequest({ method: 'album.getinfo', artist: artistName, album: albumName });

                    if (data.album && data.album.image) {
                        const images = data.album.image;
                        const largeImage = images.find(img => img.size === 'extralarge') || 
                                         images.find(img => img.size === 'large') ||
                                         images[images.length - 1];
                        
                        if (largeImage && largeImage['#text']) {
                            return largeImage['#text'];
                        }
                    }
                    return null;
                } catch (error) {
                    console.error('Error loading cover:', error);
                    return null;
                }
            }
