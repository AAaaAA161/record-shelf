                            <div class="genre-section">
                                <div class="genre-header" 
                                     onclick="app.toggleGenre(${globalGenreIndex})" 
                                     style="border-left: 3px solid ${genreColor}">
                                    <div style="display: flex; align-items: center; gap: 12px; flex: 1;">
                                        <span class="genre-title">${this.escapeHtml(genre)}</span>
                                        <span class="genre-count">${albums.length}</span>
                                    </div>
                                    <div style="display: flex; align-items: center; gap: 8px;">
                                        <div class="genre-preview-covers">
                                            ${previewCovers}
                                        </div>
                                        ${shuffleBtn}
                                        <span class="genre-icon">▼</span>
                                    </div>
                                </div>
                                <div class="genre-content" id="genre-${globalGenreIndex}">
                                    <div class="albums-grid">
                                        ${albums.map((album, index) => this.renderAlbumCard(album, index)).join('')}
                                    </div>
                                </div>
                            </div>
                        `;
                        globalGenreIndex++;
                    });
                    
                    html += `
                            </div>
                        </div>
                    `;
                });

                html += `
                    <div class="app-footer">
                        Record Shelf v${APP_VERSION}
                    </div>
                `;

                document.getElementById('app').innerHTML = html;
            }

            renderRandomAlbums() {
                // Select 3 random albums with covers
                const albumsWithCovers = this.albums.filter(album => album.coverUrl);
                const randomAlbums = [];
                if (albumsWithCovers.length >= 3) {
                    // Use proper random selection without bias
                    const available = [...albumsWithCovers];
                    
                    for (let i = 0; i < 3; i++) {
                        const randomIndex = Math.floor(Math.random() * available.length);
                        randomAlbums.push(available[randomIndex]);
                        available.splice(randomIndex, 1); // Remove to avoid duplicates
                    }
                }

                if (randomAlbums.length < 3) return '';

                return `
                    <div class="random-hero" style="--hero-bg: url('${randomAlbums[0].coverUrl}')">
                        <div class="random-albums-container">
                            ${randomAlbums.map(album => {
                                // Build Tidal links same way as renderAlbumCard
                                let tidalDeepLink, tidalWebLink;
                                if (album.tidalId) {
                                    tidalDeepLink = `tidal://play/album/${album.tidalId}`;
                                    tidalWebLink = `https://listen.tidal.com/album/${album.tidalId}`;
                                } else {
                                    const searchQuery = encodeURIComponent(`${album.artist} ${album.album}`);
                                    tidalDeepLink = `tidal://search?q=${searchQuery}`;
                                    tidalWebLink = `https://listen.tidal.com/search?q=${searchQuery}`;
                                }
                                
                                return `
                                    <div class="random-album-item" 
                                         onclick="app.openInTidal('${tidalDeepLink.replace(/'/g, "\\'")}', '${tidalWebLink.replace(/'/g, "\\'")}', ${!!album.tidalId}, '${album.tidalId || ''}')"
                                         onmouseover="this.style.transform='translateY(-4px)'" 
                                         onmouseout="this.style.transform='translateY(0)'">
                                        <img src="${album.coverUrl}" 
                                             alt="${this.escapeHtml(album.album)}" 
                                             class="random-album-cover">
                                        <div class="random-album-title">${this.escapeHtml(album.album)}</div>
                                        <div class="random-album-artist">${this.escapeHtml(album.artist)}</div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                        <div class="random-reroll">
                            <button class="shuffle-btn" onclick="app.rerollRandomAlbums()" title="Andere Zufallsalben" aria-label="Andere Zufallsalben">🎲</button>
                        </div>
                    </div>
                    `;
            }

            rerollRandomAlbums() {
                document.getElementById('randomAlbums').innerHTML = this.renderRandomAlbums();
            }

            toggleGenre(index) {
                const headers = document.querySelectorAll('.genre-header');
                const contents = document.querySelectorAll('.genre-content');
                
                headers[index].classList.toggle('active');
                contents[index].classList.toggle('active');
            }

            shuffleCategory(mainCategory) {
                // Same category mapping as renderAlbumsByGenre
                const categoryAlbums = this.albums.filter(album =>
                    this.getMainCategory(album.genre || 'Unknown') === mainCategory
                );

                if (categoryAlbums.length === 0) {
                    alert('Keine Alben in dieser Kategorie gefunden.');
                    return;
                }

                // Pick random album
                const randomAlbum = categoryAlbums[Math.floor(Math.random() * categoryAlbums.length)];

                // Build Tidal links
                let tidalDeepLink, tidalWebLink;
                if (randomAlbum.tidalId) {
                    tidalDeepLink = `tidal://play/album/${randomAlbum.tidalId}`;
                    tidalWebLink = `https://listen.tidal.com/album/${randomAlbum.tidalId}`;
                } else {
                    const searchQuery = encodeURIComponent(`${randomAlbum.artist} ${randomAlbum.album}`);
                    tidalDeepLink = `tidal://search?q=${searchQuery}`;
                    tidalWebLink = `https://listen.tidal.com/search?q=${searchQuery}`;
                }

                // Open in Tidal
                this.openInTidal(tidalDeepLink, tidalWebLink, !!randomAlbum.tidalId, randomAlbum.tidalId || '');
            }

            shuffleGenre(genreName, genreIndex) {
                // Find all albums with this exact genre
                const genreAlbums = this.albums.filter(album => {
                    return album.genre && album.genre.toLowerCase() === genreName.toLowerCase();
                });

                if (genreAlbums.length === 0) {
                    alert('Keine Alben in diesem Genre gefunden.');
                    return;
                }

                // Pick random album
                const randomAlbum = genreAlbums[Math.floor(Math.random() * genreAlbums.length)];

                // Build Tidal links
                let tidalDeepLink, tidalWebLink;
                if (randomAlbum.tidalId) {
                    tidalDeepLink = `tidal://play/album/${randomAlbum.tidalId}`;
                    tidalWebLink = `https://listen.tidal.com/album/${randomAlbum.tidalId}`;
                } else {
                    const searchQuery = encodeURIComponent(`${randomAlbum.artist} ${randomAlbum.album}`);
                    tidalDeepLink = `tidal://search?q=${searchQuery}`;
                    tidalWebLink = `https://listen.tidal.com/search?q=${searchQuery}`;
                }

                // Open in Tidal
                this.openInTidal(tidalDeepLink, tidalWebLink, !!randomAlbum.tidalId, randomAlbum.tidalId || '');
            }

            loadNewCSV() {
                this.showUploadScreen();
            }

            exportBackup() {
                try {
                    this.downloadBackup();
                    this.showToast('✅ Backup gespeichert');
                } catch (error) {
                    console.error('Fehler beim Exportieren:', error);
                    alert('Fehler beim Erstellen des Backups: ' + error.message);
                }
            }

            importBackup(event) {
                const file = event.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                
                reader.onload = async (e) => {
                    try {
                        const backup = JSON.parse(e.target.result);
                        
                        // Validate backup structure
                        if (!backup.albums || !Array.isArray(backup.albums)) {
                            throw new Error('Ungültiges Backup-Format');
                        }

                        // Confirm restore
                        const message = `Backup vom ${new Date(backup.exportDate).toLocaleDateString()}\n` +
                                      `${backup.albumCount} Alben\n\n` +
                                      `Aktuelle Daten überschreiben?`;
                        
                        if (!confirm(message)) {
                            event.target.value = ''; // Reset file input
                            return;
                        }

                        // Restore albums
                        this.albums = backup.albums;
                        // Backups before v1.4.7 have no overrides: keep the current ones
                        if (backup.genreOverrides) this.genreOverrides = backup.genreOverrides;
                        if (backup.categoryOverrides) this.categoryOverrides = backup.categoryOverrides;
                        this.applyGenreOverrides(this.albums);
                        
                        // Save to IndexedDB
                        await this.saveToIndexedDB();
                        
                        // Re-render
                        this.renderAlbumsByGenre();
                        
                        
                        // Reset file input
                        event.target.value = '';
                        
                    } catch (error) {
                        console.error('Fehler beim Importieren:', error);
                        alert('Fehler beim Laden des Backups: ' + error.message);
                        event.target.value = '';
                    }
                };
                
                reader.readAsText(file);
            }

            openInTidal(deepLink, webLink, hasTidalId, tidalId) {
                
                if (hasTidalId) {
                    // Try to detect if app opens
                    let appOpened = false;
                    
                    const handleVisibilityChange = () => {
                        if (document.hidden) {
                            appOpened = true;
                        }
                    };
                    
                    const handleBlur = () => {
                        appOpened = true;
                    };
                    
                    document.addEventListener('visibilitychange', handleVisibilityChange);
                    window.addEventListener('blur', handleBlur);
                    
                    // Try play deep link for mobile app
                    const playLink = `tidal://play/album/${tidalId}`;
                    window.location.href = playLink;
                    
                    // Check after 2 seconds if app opened
                    setTimeout(() => {
                        document.removeEventListener('visibilitychange', handleVisibilityChange);
                        window.removeEventListener('blur', handleBlur);
                        
                        if (!appOpened) {
                            console.log('App nicht installiert, öffne Web Player');
                            window.open(webLink, '_blank');
                        } else {
                            console.log('App geöffnet, kein Web Player nötig');
                        }
                    }, 2000);
                } else {
                    // No Tidal ID - open search in both app and web
                    let appOpened = false;
                    
                    const handleVisibilityChange = () => {
                        if (document.hidden) appOpened = true;
                    };
                    
                    const handleBlur = () => {
                        appOpened = true;
                    };
                    
                    document.addEventListener('visibilitychange', handleVisibilityChange);
                    window.addEventListener('blur', handleBlur);
                    
                    window.location.href = deepLink;
                    
                    setTimeout(() => {
                        document.removeEventListener('visibilitychange', handleVisibilityChange);
                        window.removeEventListener('blur', handleBlur);
                        
                        if (!appOpened) {
                            window.open(webLink, '_blank');
                        }
                    }, 1500);
                }
            }

            renderAlbumCard(album, index) {
                const initials = (album.album || '?').split(/\s+/).filter(Boolean)
                    .slice(0, 2).map(word => word[0]).join('').toUpperCase();
                const cover = album.coverUrl
                    ? `<img class="album-cover" src="${album.coverUrl}" alt="${this.escapeAttr(album.album || 'Unknown Album')}" loading="lazy">`
                    : `<div class="album-cover album-cover-placeholder">${this.escapeHtml(initials)}</div>`;

                // Use Tidal ID if available, otherwise fall back to search
                let tidalDeepLink, tidalWebLink;
                if (album.tidalId) {
                    // Try play action first, fallback to regular album link
                    tidalDeepLink = `tidal://play/album/${album.tidalId}`;
                    tidalWebLink = `https://listen.tidal.com/album/${album.tidalId}`;
                } else {
                    const searchQuery = encodeURIComponent(`${album.artist} ${album.album}`);
                    tidalDeepLink = `tidal://search?q=${searchQuery}`;
                    tidalWebLink = `https://listen.tidal.com/search?q=${searchQuery}`;
                }

                return `
                    <div class="album-card" onclick="app.openInTidal('${tidalDeepLink.replace(/'/g, "\\'")}', '${tidalWebLink.replace(/'/g, "\\'")}', ${!!album.tidalId}, '${album.tidalId || ''}')">
                        ${cover}
                        <button class="album-edit-btn" data-artist="${this.escapeAttr(album.artist || '')}"
                                onclick="event.stopPropagation(); app.showGenreDialog(this.dataset.artist)"
                                title="Genre ändern" aria-label="Genre ändern">✎</button>
                        <div class="album-info">
                            <div class="album-title">${this.escapeHtml(album.album || 'Unknown Album')}</div>
                            <div class="album-artist">${this.escapeHtml(album.artist || 'Unknown Artist')}</div>
                        </div>
                    </div>
                `;
            }

            async fetchGenreFromLastFM(artist) {
                if (this.genreCache.has(artist)) {
                    return this.genreCache.get(artist);
                }

                try {
                    const data = await this.lastfmRequest({ method: 'artist.gettoptags', artist });

                    let genre = 'Unknown';
                    if (data.toptags && data.toptags.tag && data.toptags.tag.length > 0) {
                        // Filter out non-genre tags (nationalities, decades, etc.)
                        const blacklist = [
                            // Nationalities
                            'french', 'german', 'british', 'american', 'canadian', 'australian',
                            'japanese', 'korean', 'swedish', 'norwegian', 'finnish', 'danish', 'kenya',
                            'italian', 'spanish', 'dutch', 'belgian', 'austrian', 'swiss',
                            'irish', 'scottish', 'welsh', 'icelandic', 'portuguese', 'austria', 'bayrisch', 'pakistan', 'peru',
                            'swedish', 'usa', 'ukrainian', 'ukranian',
                            // Cities/Places
                            'london', 'berlin', 'paris', 'new york', 'los angeles', 'tokyo',
                            'nyc', 'la', 'uk', 'usa', 'europe',
                            // Decades
                            '60s', '70s', '80s', '90s', '2000s', '2010s', '00s', '10s',
                            // Non-descriptive
                            'seen live', 'favorite', 'favorites', 'favourite', 'favourites',
                            'love', 'loved', 'awesome', 'beautiful', 'amazing',
                            // Genders
                            'female', 'male', 'female vocalists', 'male vocalists',
                            'female vocalist', 'male vocalist',
                            // Vague descriptors
                            'melancholic', 'melancholy', 'chill', 'atmospheric', 'cello', 'chillwave',
                            'cumbia', 'cybergrind', 'dischord', 'frenchcore', 'gospel', 'guitar',
                            'horrorcore', 'instrumental', 'mathcore', 'neocrust', 'outsider', 'touhou',
                            'bubblegum bass', 'political', 'new age', 'united states'
                        ];
                        
                        // Find first tag that's not in blacklist
                        const validTag = data.toptags.tag.find(tag => {
                            const tagName = tag.name.toLowerCase().trim();
                            return !blacklist.includes(tagName);
                        });
                        
                        if (validTag) {
                            const originalGenre = validTag.name;
                            genre = this.mapGenre(originalGenre);
                            console.log(`Genre für ${artist}: ${originalGenre} → ${genre}`);
                        } else {
                            // Fallback to first tag if all are blacklisted
                            const originalGenre = data.toptags.tag[0].name;
                            genre = this.mapGenre(originalGenre);
                            console.log(`Genre für ${artist} (fallback): ${originalGenre} → ${genre}`);
                        }
                    }

                    this.genreCache.set(artist, genre);
                    return genre;
                } catch (error) {
                    console.error('Error fetching genre:', error);
                    return 'Unknown';
                }
            }

            showLoading(message = 'Verarbeite CSV-Datei...', current = 0, total = 0) {
                const progressText = (current > 0 && total > 0) 
                    ? `<div style="margin-top: 10px; font-size: 1.2rem; font-weight: 600; color: var(--accent);">${current} / ${total}</div>`
                    : '';
                
                const progressBar = (current > 0 && total > 0)
                    ? `<div style="width: 100%; max-width: 300px; height: 4px; background: var(--bg-card); border-radius: 2px; margin: 20px auto 0; overflow: hidden;">
                        <div style="height: 100%; background: var(--accent); width: ${(current/total*100)}%; transition: width 0.3s ease;"></div>
                       </div>`
                    : '';
                
                document.getElementById('app').innerHTML = `
                    <div class="loading">
                        <div class="spinner"></div>
                        <p>${message}</p>
                        ${progressText}
                        ${progressBar}
                    </div>
                `;
            }

            showError(message) {
                document.getElementById('app').innerHTML = `
                    <div class="error">
                        <strong>Fehler:</strong> ${message}
                    </div>
                    <div class="upload-container">
                        <button class="upload-btn" onclick="app.init()">
                            Erneut versuchen
                        </button>
                    </div>
                `;
            }

            escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            escapeAttr(text) {
                return this.escapeHtml(text).replace(/"/g, '&quot;');
            }

            showGenreDialog(artist) {
                const key = this.artistKey(artist);
                const artistAlbums = this.albums.filter(a => this.artistKey(a.artist) === key);
                const current = artistAlbums[0]?.genre || 'Unknown';
                const hasOverride = !!this.genreOverrides[key];
                const genres = [...new Set(this.albums.map(a => a.genre).filter(Boolean))]
                    .sort((a, b) => a.localeCompare(b, 'de'));

                const overlay = document.createElement('div');
                overlay.className = 'genre-dialog-overlay';
                overlay.innerHTML = `
                    <div class="genre-dialog">
                        <h2>Genre für ${this.escapeHtml(artist)}</h2>
                        <p>Gilt für ${artistAlbums.length === 1 ? 'alle Alben' : `alle ${artistAlbums.length} Alben`} dieses Künstlers,
                           auch künftige, und bleibt bei jedem Import erhalten.</p>
                        <label for="genreSelect">Vorhandenes Genre</label>
                        <select id="genreSelect">
                            ${genres.map(g => `<option value="${this.escapeAttr(g)}" ${g === current ? 'selected' : ''}>${this.escapeHtml(g)}</option>`).join('')}
                        </select>
                        <label for="genreInput">Oder neues Genre</label>
                        <input id="genreInput" type="text" placeholder="z. B. Krautrock" autocomplete="off">
                        <label for="categorySelect">Kategorie für dieses Genre</label>
                        <select id="categorySelect">
                            <option value="auto">Automatisch</option>
                            ${Object.keys(this.mainCategories).map(c => `<option value="${this.escapeAttr(c)}">${this.escapeHtml(c)}</option>`).join('')}
                        </select>
                        <p class="genre-dialog-hint" id="categoryHint"></p>
                        <div class="settings-actions">
                            ${hasOverride ? '<button class="btn-secondary" data-action="reset">Last.fm-Genre</button>' : ''}
                            <button class="btn-secondary" data-action="cancel">Abbrechen</button>
                            <button class="btn-primary" data-action="save">Speichern</button>
                        </div>
                    </div>
                `;
                document.body.appendChild(overlay);

                // Category select follows the chosen genre
                const genreSelect = overlay.querySelector('#genreSelect');
                const genreInput = overlay.querySelector('#genreInput');
                const categorySelect = overlay.querySelector('#categorySelect');
                const categoryHint = overlay.querySelector('#categoryHint');
                const chosenGenre = () => {
                    const typed = genreInput.value.trim();
                    return typed ? typed.charAt(0).toUpperCase() + typed.slice(1) : genreSelect.value;
                };
                const updateCategory = () => {
                    const genre = chosenGenre();
                    categorySelect.value = this.categoryOverrides[genre.toLowerCase()] || 'auto';
                    updateHint();
                };
                const updateHint = () => {
                    const genre = chosenGenre();
                    if (categorySelect.value !== 'auto') {
                        categoryHint.textContent = `Gilt für alle Alben mit dem Genre „${genre}“.`;
                    } else {
                        categoryHint.textContent = `Automatisch: ${this.getMainCategory(genre, false)}`;
                    }
                };
                genreSelect.addEventListener('change', updateCategory);
                genreInput.addEventListener('input', updateCategory);
                categorySelect.addEventListener('change', updateHint);
                updateCategory();

                const close = () => overlay.remove();
                overlay.addEventListener('click', async (e) => {
                    const action = e.target.dataset.action;
                    if (e.target === overlay || action === 'cancel') return close();
                    if (action === 'save') {
                        const genre = chosenGenre();
                        const category = categorySelect.value;
                        close();
                        if (genre) await this.setGenreOverride(artist, genre, category);
                    }
                    if (action === 'reset') {
                        close();
                        await this.setGenreOverride(artist, null);
                    }
                });
            }

            async setGenreOverride(artist, genre, category) {
                const key = this.artistKey(artist);
                const currentGenre = this.albums.find(a => this.artistKey(a.artist) === key)?.genre;
                if (genre) {
                    // Only pin the artist's genre if it actually changes
                    if (genre !== currentGenre) this.genreOverrides[key] = genre;
                    if (category === 'auto') delete this.categoryOverrides[genre.toLowerCase()];
                    else if (category) this.categoryOverrides[genre.toLowerCase()] = category;
                } else {
                    // Back to the Last.fm genre
                    delete this.genreOverrides[key];
                    this.genreCache.delete(artist);
                    genre = await this.fetchGenreFromLastFM(artist);
                }
                this.albums.forEach(album => {
                    if (this.artistKey(album.artist) === key) album.genre = genre;
                });
                await this.saveToIndexedDB();

                // Re-render, keep open genres (plus the new one) and scroll position
                const openGenres = new Set([...document.querySelectorAll('.genre-header.active .genre-title')]
                    .map(el => el.textContent));
                openGenres.add(genre);
                const scrollY = window.scrollY;
                this.renderAlbumsByGenre();
                document.querySelectorAll('.genre-title').forEach((el, index) => {
                    if (openGenres.has(el.textContent)) this.toggleGenre(index);
                });
                window.scrollTo(0, scrollY);
                this.showToast(`✅ ${artist}: ${genre} → ${this.getMainCategory(genre)}`);
            }

            sleep(ms) {
                return new Promise(resolve => setTimeout(resolve, ms));
            }
        }

        // Initialize app
        const app = new AlbumLibraryApp();
        app.init();
    </script>
</body>
