<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Deine Musiksammlung mit Tidal-Integration">
    <meta name="theme-color" content="#d4845f">
    <title>Record Shelf</title>
    <!-- 
        Record Shelf v1.7.0 - GitHub Pages Edition
        Features: IndexedDB storage, Storage Persistence API, Options page, Export/Import backups, cards layout, dropdown menu
        
        NEU in v1.7.0 (Regale):
        - Jedes Genre ist eine waagrecht wischbare Reihe von Covern; "Alle" zeigt sie als Raster
        - Kategorien und Genres einklappbar, Zustand wird im Browser gemerkt
        - Kategorie-Leiste oben bleibt beim Scrollen sichtbar und springt zur Kategorie
        - Zufallsknöpfe pro Kategorie und Genre bleiben

        NEU in v1.6.0 (Genres):
        - Feinere Genres: Trip-hop, Ambient, House, IDM, Dream pop … bleiben eigene Genres
        - Klügere Tag-Wahl: erstes der Top-6-Tags, das ein bekanntes Genre ist
        - Last.fm-Tags pro Künstler werden gespeichert (Neu-Zuordnung ohne neue Abfrage)
        - Menü "Genres neu bestimmen" (lädt vorher automatisch ein Backup herunter)

        NEU in v1.5.1 (Genre-Zuordnung):
        - Schreibweisen vereinheitlicht ("trip hop" = "trip-hop", "drum n bass" = "drum and bass")
        - Keine Fehlgriffe mehr über Stichwörter ("New wave" → Rock statt Electronic, "Trip hop" ≠ Urban)
        - Viele Genres zugeordnet, die vorher in "Other" landeten (Chanson, Fado, Disco, Gospel …)
        - Schreibweise: R&B, UK garage, IDM; Industrial → Experimental
        - Echte Genres (Gospel, New age, Mathcore …) nicht mehr auf der Blacklist

        NEU in v1.5.0 (Optik):
        - Untertitel unter dem Logo entfernt, Zufallsalben-Knopf mit Shuffle-Symbol
        - Schreibschrift nur noch im Logo, Kategorien in Inter
        - Cover ohne Kartenbox, flachere Flächen ohne Schatten
        - Neutrale Platzhalter mit Initialen statt bunter Verläufe
        - Zufallsalben mit unscharfem Cover als Hintergrund

        NEU in v1.4.9:
        - 🐛 Knöpfe oben ragen am Handy nicht mehr über den Rand
        - "CSV importieren" ist jetzt im Optionen-Menü
        - Albumtitel zweizeilig, Genre ändern über ✎ auf dem Cover
        - Besser lesbare Zahlen (Statistik, Anzahl pro Genre/Kategorie)
        - Zufallsalben oben neu würfeln

        NEU in v1.4.8:
        - 🗂️ Kategorie pro Genre wählbar (im Genre-Dialog), z. B. "Hard bop" → Traditional & Roots
        - Gilt für alle Alben mit diesem Genre, bleibt bei Import und im Backup erhalten

        NEU in v1.4.7:
        - ✎ Genre von Hand ändern: Tipp auf das Genre-Schild eines Albums
        - Gilt für alle Alben des Künstlers, bleibt bei CSV-Import und Neuladen erhalten
        - Korrekturen sind im Backup enthalten

        NEU in v1.4.6:
        - 🐛 Zufall pro Kategorie nimmt nur noch Alben dieser Kategorie (auch "Other")
        - 🐛 "Neue CSV laden" löscht die Sammlung erst, wenn der neue Import fertig ist
        - ⚡ CSV-Import lädt nur neue Alben (und fehlende Genres/Cover) von Last.fm
        - 🛡️ Last.fm gedrosselt, mit automatischer Wiederholung bei Fehlern
        - ✅ Rückmeldung nach "Backup erstellen"
        - 🧹 Ungenutzten Code entfernt

        NEU in v1.4.5:
        - 🧹 PWA-Code entfernt (Manifest, Service Worker, Install-Prompt)
        - 🧹 Netlify-Reste entfernt (package.json, Deployment-Anleitung)

        NEU in v1.4.4:
        - 🔧 CSV-Parsing-Fix: Unterstützt jetzt Tidal Export Format!
        - ✅ Flexible Spaltennamen: "Album", "Artist name", "Tidal - id"
        - 🎯 Zero-Config: Tidal CSV funktioniert ohne Änderungen
        - 🐛 Regression-Fix: Tidal öffnet wieder Alben statt Suche
        
        NEU in v1.4.3:
        - 🎲 Random-Alben-Fix: Korrekte uniforme Zufallsauswahl
        - ❌ Bias entfernt: Alle Alben haben jetzt gleiche Chance
        - ⚡ Performance: 1000x schneller (direkte Auswahl statt Shuffle)
        - 🐛 Bug gefunden durch User-Feedback!
        
        NEU in v1.4.2:
        - 🧹 Code-Optimierung: 43 Zeilen entfernt (~1.5% kleiner)
        - ❌ Ungenutztes CSS entfernt (settings-btn)
        - ❌ Redundante console.logs entfernt (von 34 auf 15 reduziert)
        - ❌ Unnötige !important Flags entfernt
        - ✨ Saubererer, wartbarer Code
        
        NEU in v1.4.1:
        - 🔄 Menü-Konsolidierung: Backup & Einstellungen in einem "Optionen" Dropdown
        - 📱 Touch Events Fix: Drag & Drop funktioniert jetzt in Firefox/Android
        - ✨ Nur 2 Buttons: Besseres Layout auf kleinen Screens
        
        NEU in v1.4.0:
        - ⚙️ Einstellungen-Seite mit Kategorie-Sortierung
        - Drag & Drop: Hauptkategorien umsortieren
        - Persistierung der Kategorie-Reihenfolge in IndexedDB
        - Versionsnummer im Footer auf allen Seiten
        
        NEU in v1.3.2.3:
        - Mobile Polish: Random Alben kleiner (max 100px)
        - Mobile Polish: Akkordions kompakter (kleinere Schrift, weniger Padding)
        - Mobile Polish: Text-Umbrüche verhindert (nowrap)
        - Mobile Polish: Abstände reduziert (10px statt 16px)
        
        NEU in v1.3.2.2:
        - Mobile Layout Fix: Buttons horizontal aligned
        - Mobile Layout Fix: Random Alben gleich groß
        - Mobile Layout Fix: Album-Grid immer 2 Spalten
        
        NEU in v1.3.2.1:
        - Storage Persistence API (fragt um Erlaubnis, Daten dauerhaft zu speichern)
        - Hilft gegen automatisches Löschen in Brave & anderen Privacy-Browsern
        
        NEU in v1.3.2:
        - IndexedDB statt localStorage (robuster, persistenter)
        - Automatisches Laden aus IndexedDB
        - JSON Import füllt IndexedDB automatisch

    -->
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
:root {
            --bg-primary: #1f2128;
            --bg-secondary: #2a2d3a;
            --bg-card: #363944;
            --bg-card-hover: #3f4350;
            --text-primary: #ffffff;
            --text-secondary: #9ca3bf;
            --accent: #d4845f;
            --accent-dark: #c07653;
            --border: #3a3f5f;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
            --shadow-lg: 0 10px 40px rgba(0, 0, 0, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
        }

        #app {
            max-width: 1400px;
            margin: 0 auto;
            padding: 30px 20px;
        }

        h1 {
            font-family: 'Pacifico', cursive;
            font-size: 3rem;
            font-weight: 400;
            text-align: center;
            margin-top: 0.5rem;
            margin-bottom: 0.5rem;
            letter-spacing: 1px;
            color: var(--text-primary);
        }

        /* Upload Screen */
        .upload-container {
            text-align: center;
            padding: 40px 20px 80px;
            animation: fadeIn 0.6s ease-out;
        }

        /* Modern Cards Layout */
        .upload-cards-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(450px, 1fr));
            gap: 30px;
            padding: 40px 20px;
            max-width: 1200px;
            margin: 0 auto;
            animation: fadeIn 0.6s ease-out;
        }

        @media (max-width: 1000px) {
            .upload-cards-container {
                grid-template-columns: 1fr;
                max-width: 600px;
            }
        }

        .upload-card {
            background: var(--bg-secondary);
            border-radius: 20px;
            padding: 30px;
            border: 1px solid var(--border);
            transition: all 0.3s ease;
        }

        .upload-card:hover {
            border-color: var(--accent);
            transform: translateY(-4px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
        }

        .upload-card-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .upload-card-icon {
            font-size: 3rem;
            margin-bottom: 15px;
            opacity: 0.8;
        }

        .upload-card h2 {
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-primary);
        }

        .upload-card-header p {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        .backup-restore-area {
            text-align: center;
            padding: 30px 20px;
        }

        .backup-icon {
            font-size: 4rem;
            opacity: 0.5;
            margin-bottom: 20px;
        }

        .backup-restore-btn {
            background: linear-gradient(135deg, rgba(100, 150, 255, 0.2), rgba(100, 150, 255, 0.1));
            color: rgba(100, 150, 255, 1);
            border: 2px solid rgba(100, 150, 255, 0.3);
            padding: 16px 36px;
            font-size: 1.05rem;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(100, 150, 255, 0.1);
        }

        .backup-restore-btn:hover {
            background: linear-gradient(135deg, rgba(100, 150, 255, 0.3), rgba(100, 150, 255, 0.2));
            border-color: rgba(100, 150, 255, 0.5);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(100, 150, 255, 0.2);
        }

        .upload-area {
            background: var(--bg-card);
            border: 2px dashed var(--border);
            border-radius: 16px;
            padding: 40px 30px;
            transition: all 0.3s ease;
            cursor: pointer;
            margin-bottom: 20px;
        }

        .upload-area:hover, .upload-area.dragging {
            border-color: var(--accent);
            background: var(--bg-card-hover);
            transform: scale(1.02);
        }

        .upload-icon {
            font-size: 2.5rem;
            margin-bottom: 15px;
            opacity: 0.5;
        }

        .upload-text {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .upload-hint {
            color: var(--text-secondary);
            font-size: 0.85rem;
            margin-bottom: 20px;
        }

        .upload-btn {
            background: var(--accent);
            color: var(--bg-primary);
            border: none;
            padding: 14px 32px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: var(--shadow);
        }

        .upload-btn:hover {
            background: var(--accent-dark);
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        .file-input {
            display: none;
        }

        .csv-example {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 12px;
            padding: 20px;
            text-align: left;
        }

        .csv-example h3 {
            font-size: 0.95rem;
            margin-bottom: 12px;
            font-weight: 600;
            opacity: 0.8;
        }

        .csv-example code {
            display: block;
            background: var(--bg-primary);
            padding: 20px;
            border-radius: 10px;
            font-family: 'SF Mono', 'Monaco', 'Consolas', monospace;
            font-size: 0.9rem;
            line-height: 1.8;
            color: var(--accent);
            margin: 10px 0;
        }

        .csv-example p {
            font-size: 0.9rem;
            line-height: 1.6;
            color: var(--text-secondary);
        }

        /* Stats */
        .stats {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-item {
            background: transparent;
            padding: 0;
            text-align: center;
            transition: opacity 0.2s ease;
        }

        .stat-item:hover {
            opacity: 1;
        }

        .stat-number {
            display: inline;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-right: 4px;
        }

        .stat-label {
            display: inline;
            color: var(--text-secondary);
            font-size: 0.75rem;
            font-weight: 400;
        }

        /* Button Container */
        .button-container {
            text-align: center;
            margin-bottom: 30px;
            display: flex;
            gap: 10px;
            justify-content: center;
            align-items: center;
            flex-wrap: nowrap;
            padding: 0 10px;
        }

        @media (max-width: 768px) {
            .button-container {
                gap: 8px;
            }
            
            .button-container .reset-btn,
            .button-container .backup-dropdown-btn {
                padding: 12px 16px;
                font-size: 0.9rem;
                white-space: nowrap;
            }
        }

        /* Reset Button */
        .reset-btn {
            background: var(--bg-secondary);
            color: var(--text-primary);
            border: 1px solid var(--border);
            padding: 14px 32px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .reset-btn:hover {
            background: var(--bg-card);
            border-color: var(--accent);
            transform: translateY(-2px);
        }

        .export-btn, .import-btn {
            background: var(--bg-secondary);
            color: var(--text-primary);
            border: 1px solid var(--border);
            padding: 14px 32px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .export-btn:hover {
            background: rgba(107, 207, 143, 0.1);
            border-color: rgba(107, 207, 143, 0.5);
            transform: translateY(-2px);
        }

        .import-btn:hover {
            background: rgba(100, 150, 255, 0.1);
            border-color: rgba(100, 150, 255, 0.5);
            transform: translateY(-2px);
        }

        /* Dropdown Menu for Backup */
        .backup-dropdown {
            position: relative;
            display: inline-block;
        }

        .backup-dropdown-btn {
            background: var(--bg-secondary);
            color: var(--text-primary);
            border: 1px solid var(--border);
            padding: 14px 32px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .backup-dropdown-btn:hover {
            background: var(--bg-card);
            border-color: var(--accent);
            transform: translateY(-2px);
        }

        .dropdown-arrow {
            font-size: 0.8rem;
            transition: transform 0.2s ease;
        }

        .backup-dropdown-btn:hover .dropdown-arrow {
            transform: translateY(2px);
        }

        .backup-dropdown-menu {
            position: absolute;
            top: calc(100% + 8px);
            left: 50%;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            min-width: 280px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            opacity: 0;
            visibility: hidden;
            transform: translate(-50%, -10px);
            transition: all 0.2s ease;
            z-index: 1000;
            overflow: hidden;
        }

        .backup-dropdown-menu.show {
            opacity: 1;
            visibility: visible;
            transform: translate(-50%, 0);
        }

        .backup-dropdown-menu button {
            width: 100%;
            background: none;
            border: none;
            padding: 16px 20px;
            text-align: left;
            cursor: pointer;
            transition: background 0.2s ease;
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--text-primary);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .backup-dropdown-menu button:last-of-type {
            border-bottom: none;
        }

        .backup-dropdown-menu button:hover {
            background: var(--bg-card-hover);
        }

        .menu-icon {
            font-size: 1.5rem;
            opacity: 0.8;
        }

        .menu-title {
            font-weight: 600;
            font-size: 0.95rem;
            margin-bottom: 2px;
        }

        .menu-desc {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .menu-info {
            padding: 12px 20px;
            background: rgba(0, 0, 0, 0.2);
            font-size: 0.8rem;
            color: var(--text-secondary);
            text-align: center;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Settings Button */
        /* Settings Screen */
        .settings-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        .settings-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .settings-header h1 {
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .settings-section {
            background: var(--bg-secondary);
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 30px;
        }

        .settings-section h2 {
            font-size: 1.3rem;
            margin-bottom: 10px;
        }

        .settings-section p {
            color: var(--text-secondary);
            margin-bottom: 20px;
            font-size: 0.95rem;
        }

        .category-list {
            list-style: none;
            padding: 0;
        }

        .category-item {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px 20px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 16px;
            cursor: move;
            user-select: none;
            transition: all 0.2s ease;
        }

        .category-item:hover {
            background: var(--bg-card-hover);
            transform: translateX(4px);
        }

        .category-item.dragging {
            opacity: 0.5;
        }

        .drag-handle {
            font-size: 1.5rem;
            color: var(--text-secondary);
            cursor: grab;
        }

        .drag-handle:active {
            cursor: grabbing;
        }

        .category-item-content {
            flex: 1;
            font-size: 1.1rem;
            font-weight: 500;
        }

        .settings-actions {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .settings-actions button {
            padding: 14px 32px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            border: none;
        }

        .btn-primary {
            background: var(--accent);
            color: var(--bg-primary);
        }

        .btn-primary:hover {
            background: var(--accent-dark);
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: var(--bg-secondary);
            color: var(--text-primary);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background: var(--bg-card);
            border-color: var(--accent);
        }

        @media (max-width: 768px) {
            .settings-btn {
                padding: 12px 16px;
                font-size: 0.9rem;
            }

            .settings-container {
                padding: 16px;
            }

            .settings-section {
                padding: 20px;
            }

            .category-item {
                padding: 12px 16px;
            }

            .category-item-content {
                font-size: 1rem;
            }
        }

        /* Random Albums Showcase */
        .random-albums-container {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin: 0 auto;
            max-width: 600px;
            padding: 0 20px;
        }

        .random-album-item {
            flex: 0 0 calc(33.333% - 8px);
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .random-album-cover {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
        }

        .random-album-title {
            margin-top: 6px;
            font-size: 0.8rem;
            font-weight: 500;
            text-align: center;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .random-album-artist {
            font-size: 0.7rem;
            color: var(--text-secondary);
            text-align: center;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        @media (max-width: 768px) {
            .random-albums-container {
                gap: 10px;
                padding: 0 16px;
            }

            .random-album-item {
                flex: 1 1 0;
                min-width: 0;
            }

            .random-album-title {
                font-size: 0.7rem;
                margin-top: 4px;
            }

            .random-album-artist {
                font-size: 0.65rem;
            }
        }

        .random-reroll {
            display: flex;
            justify-content: center;
            margin-top: 16px;
        }

        .random-hero {
            position: relative;
            isolation: isolate;
            overflow: hidden;
            max-width: 640px;
            margin: 10px auto 36px;
            padding: 28px 0 20px;
            border-radius: 20px;
        }

        .random-hero::before {
            content: '';
            position: absolute;
            inset: -40px;
            background: var(--hero-bg) center / cover;
            filter: blur(40px) saturate(1.4);
            opacity: 0.5;
            z-index: -2;
        }

        .random-hero::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, rgba(31, 33, 40, 0.1), var(--bg-primary));
            z-index: -1;
        }

        /* Main Category Sections */
        .main-category-section {
            margin-bottom: 40px;
        }

        .main-category-header {
            background: transparent;
            padding: 16px 0;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            user-select: none;
        }

        .main-category-title {
            font-family: 'Inter', sans-serif;
            font-size: 1.3rem;
            font-weight: 600;
            letter-spacing: -0.01em;
        }

        .main-category-count {
            background: transparent;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 500;
            color: var(--text-secondary);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .shuffle-btn {
            background: var(--bg-secondary);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 1.2rem;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .shuffle-btn:hover {
            background: var(--bg-card);
            transform: rotate(180deg);
        }

        .shuffle-btn:active {
            transform: rotate(180deg) scale(0.95);
        }

        .genre-shuffle-btn {
            background: transparent;

<body>
    <div class="container">
        <header>
            <h1>Record Shelf</h1>
        </header>

        <div id="app"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script>
        const APP_VERSION = '1.7.0';

        class AlbumLibraryApp {
            constructor() {
                // Last.fm API Key (Browser-App: Key ist im Quelltext sichtbar)
                this.LASTFM_API_KEY = 'c791b2900db01345232549f0bb64b168';
                
                this.albums = [];
                this.artistTags = {}; // artist (lowercase) -> top Last.fm tags, for re-classifying without new requests
                this.tagBlacklist = this.createTagBlacklist();
                this.genreOverrides = {}; // artist (lowercase) -> genre chosen by hand
                this.categoryOverrides = {}; // normalized genre -> main category chosen by hand
                this.genreMapping = this.createGenreMapping();
                this.mainCategories = this.createMainCategories();
                this.categoryIndex = this.buildCategoryIndex();
                this.genreMergeIndex = this.buildGenreMergeIndex();
                
                // Default category order
                this.categoryOrder = [
                    '🤘 Metal',
                    '🎸 Rock & Alternative',
                    '🔮 Experimental',
                    '🎧 Electronic & Synth',
                    '🎤 Pop',
                    '🎵 Urban',
                    '🎺 Traditional & Roots',
                    '🌍 World'
                ];
            }

            // ---------------------------------------------------------------
            // Genre-Logik
            // Alle Vergleiche laufen über normalizeGenre(): klein geschrieben,
            // Bindestriche/Unterstriche als Leerzeichen, Schreibvarianten
            // vereinheitlicht ("trip-hop" = "trip hop", "drum n bass" = "drum and bass").
            // ---------------------------------------------------------------

            normalizeGenre(text) {
                const g = (text || '').toLowerCase().trim()
                    .replace(/[-_/]+/g, ' ')
                    .replace(/\s+/g, ' ');
                const variants = {
                    'rnb': 'r&b', 'r and b': 'r&b', 'r n b': 'r&b',
                    'hiphop': 'hip hop', 'triphop': 'trip hop',
                    'synthpop': 'synth pop', 'electropop': 'electro pop',
                    'postpunk': 'post punk', 'postrock': 'post rock',
                    'drum n bass': 'drum and bass', 'drum & bass': 'drum and bass', 'dnb': 'drum and bass',
                    'avantgarde': 'avant garde', 'neoclassical': 'neo classical', 'neosoul': 'neo soul',
                    'lofi': 'lo fi', 'kpop': 'k pop', 'jpop': 'j pop',
                    'darkwave': 'dark wave', 'coldwave': 'cold wave', 'newwave': 'new wave',
                    'ndw': 'neue deutsche welle', 'world music': 'world'
                };
                return variants[g] || g;
            }

            // How a genre is shown; everything not listed gets a capital first letter
            displayGenre(text) {
                const key = this.normalizeGenre(text);
                const names = {
                    'r&b': 'R&B', 'contemporary r&b': 'Contemporary R&B', 'uk garage': 'UK garage',
                    'idm': 'IDM', 'edm': 'EDM', 'ebm': 'EBM', 'k pop': 'K-Pop', 'j pop': 'J-Pop',
                    'post punk': 'Post-punk', 'post rock': 'Post-rock', 'post metal': 'Post-metal',
                    'post hardcore': 'Post-hardcore', 'post punk revival': 'Post-punk revival',
                    'trip hop': 'Trip-hop', 'hip hop': 'Hip-hop', 'lo fi': 'Lo-fi', 'lo fi hip hop': 'Lo-fi hip-hop',
                    'synth pop': 'Synth-pop', 'electro pop': 'Electropop', 'dance pop': 'Dance-pop',
                    'neo soul': 'Neo-soul', 'avant garde': 'Avant-garde', 'neo psychedelia': 'Neo-psychedelia',
                    'neo classical': 'Neoclassical', 'singer songwriter': 'Singer-songwriter',
                    'neue deutsche welle': 'Neue Deutsche Welle', 'neue deutsche härte': 'Neue Deutsche Härte',
                    'nu metal': 'Nu metal', 'alt country': 'Alt-country', 'mpb': 'MPB'
                };
                if (names[key]) return names[key];
                return key ? key.charAt(0).toUpperCase() + key.slice(1) : 'Unknown';
            }

            createMainCategories() {
                return {
                    '🤘 Metal': {
                        genres: ['metal', 'heavy metal', 'death metal', 'black metal', 'thrash metal',
                                'doom metal', 'progressive metal', 'power metal', 'metalcore', 'nu metal',
                                'deathcore', 'grindcore', 'cybergrind', 'drone', 'drone metal', 'drone doom',
                                'sludge metal', 'stoner metal', 'speed metal', 'industrial metal', 'folk metal',
                                'post metal', 'gothic metal', 'symphonic metal', 'groove metal',
                                'neue deutsche härte'],
                        color: 'rgba(80, 80, 80, 0.7)',
                        order: 1
                    },
                    '🎸 Rock & Alternative': {
                        genres: ['rock', 'punk', 'alternative', 'alternative rock', 'indie', 'indie rock',
                                'grunge', 'shoegaze', 'post punk', 'post rock', 'noise rock', 'lo fi', 'emo',
                                'screamo', 'hamburger schule', 'post hardcore', 'hardcore', 'hardcore punk',
                                'sludge', 'slowcore', 'riot grrrl', 'new wave', 'no wave', 'post punk revival',
                                'britpop', 'noise pop', 'garage rock', 'psychedelic rock', 'neo psychedelia',
                                'krautrock', 'math rock', 'stoner rock', 'hard rock', 'classic rock', 'art rock',
                                'progressive rock', 'glam rock', 'pop punk', 'ska punk', 'gothic rock',
                                'gothic', 'deathrock'],
                        color: 'rgba(212, 132, 95, 0.5)',
                        order: 2
                    },
                    '🔮 Experimental': {
                        genres: ['experimental', 'avant garde', 'noise', 'sound art', 'psychedelic',
                                'industrial', 'musique concrete', 'free improvisation', 'field recordings',
                                'dark ambient', 'outsider'],
                        color: 'rgba(120, 120, 130, 0.5)',
                        order: 3
                    },
                    '🎧 Electronic & Synth': {
                        genres: ['electronic', 'electronica', 'synth pop', 'techno', 'house', 'ambient',
                                'edm', 'idm', 'downtempo', 'trip hop', 'drum and bass', 'jungle', 'dubstep',
                                'trance', 'synthwave', 'electro', 'glitch', 'vaporwave', 'minimal synth',
                                'minimal', 'electroclash', 'dark wave', 'cold wave', 'breakcore', 'nightcore',
                                'uk garage', 'future garage', 'chillout', 'dance', 'disco', 'italo disco',
                                'indietronica', 'deconstructed club', 'footwork', 'leftfield', 'big beat',
                                'acid house', 'deep house', 'tech house', 'minimal techno', 'ebm'],
                        color: 'rgba(120, 150, 180, 0.5)',
                        order: 4
                    },
                    '🎤 Pop': {
                        genres: ['pop', 'indie pop', 'dream pop', 'art pop', 'electro pop', 'dance pop',
                                'pop rock', 'power pop', 'chamber pop', 'baroque pop', 'singer songwriter',
                                'liedermacher', 'chanson', 'schlager', 'neue deutsche welle', 'k pop', 'j pop',
                                'city pop', 'hyperpop'],
                        color: 'rgba(198, 120, 141, 0.5)',
                        order: 5
                    },
                    '🎵 Urban': {
                        genres: ['hip hop', 'rap', 'r&b', 'contemporary r&b', 'trap', 'soul', 'neo soul',
                                'experimental hip hop', 'instrumental hip hop', 'abstract hip hop', 'grime',
                                'deutschrap', 'german hip hop', 'cloud rap', 'gangsta rap', 'conscious hip hop',
                                'east coast rap', 'west coast rap', 'underground hip hop', 'lo fi hip hop',
                                'jazz rap', 'motown'],
                        color: 'rgba(180, 140, 120, 0.5)',
                        order: 6
                    },
                    '🎺 Traditional & Roots': {
                        genres: ['jazz', 'blues', 'folk', 'indie folk', 'freak folk', 'neofolk', 'country',
                                'alt country', 'outlaw country', 'americana', 'bluegrass', 'gospel',
                                'classical', 'modern classical', 'contemporary classical', 'neo classical',
                                'minimalism', 'opera', 'baroque', 'soundtrack', 'reggae', 'roots reggae',
                                'dub', 'ska', 'dancehall', 'funk', 'acoustic', 'piano', 'trumpet',
                                'bebop', 'free jazz', 'hard bop', 'cool jazz', 'modal jazz', 'spiritual jazz',
                                'avant garde jazz', 'jazz fusion', 'fusion', 'swing', 'big band', 'delta blues'],
                        color: 'rgba(200, 160, 100, 0.5)',
                        order: 7
                    },
                    '🌍 World': {
                        genres: ['world', 'afrobeat', 'afrobeats', 'african', 'africa', 'latin', 'bossa nova',
                                'flamenco', 'fado', 'samba', 'mpb', 'cumbia', 'tango', 'reggaeton', 'klezmer',
                                'celtic', 'balkan', 'throat singing', 'desert blues', 'highlife', 'tuareg',
                                'first nations', 'germany'],
                        color: 'rgba(130, 150, 140, 0.5)',
                        order: 8
                    }
                };
            }

            // normalized genre -> category (first category wins)
            buildCategoryIndex() {
                const index = new Map();
                Object.entries(this.mainCategories)
                    .sort((a, b) => a[1].order - b[1].order)
                    .forEach(([category, data]) => data.genres.forEach(g => {
                        const key = this.normalizeGenre(g);
                        if (!index.has(key)) index.set(key, category);
                    }));
                return index;
            }

            getMainCategory(genre, useOverrides = true) {
                const key = this.normalizeGenre(genre);

                // Category chosen by hand wins
                if (useOverrides && this.categoryOverrides[key]) {
                    return this.categoryOverrides[key];
                }

                if (this.categoryIndex.has(key)) {
                    return this.categoryIndex.get(key);
                }

                // Fallback: whole words, or word endings for longer keywords
                // ("krautrock", "tech house"). Short words like "pop" and "rap"
                // only match as whole words.
                const keywordMappings = [
                    ['🤘 Metal', ['metal']],
                    ['🎸 Rock & Alternative', ['rock', 'punk', 'grunge', 'shoegaze']],
                    ['🔮 Experimental', ['experimental', 'avant', 'noise']],
                    ['🎧 Electronic & Synth', ['techno', 'house', 'trance', 'electronic', 'electronica', 'synth']],
                    ['🎤 Pop', ['pop']],
                    ['🎵 Urban', ['rap', 'hip', 'r&b', 'soul']],
                    ['🎺 Traditional & Roots', ['jazz', 'blues', 'folk', 'country', 'classical', 'gospel']],
                    ['🌍 World', ['world', 'latin', 'african', 'afro']]
                ];
                const words = key.split(' ');
                for (const [category, keywords] of keywordMappings) {
                    const hit = words.some(word => keywords.some(k =>
                        word === k || (k.length >= 4 && word.endsWith(k))
                    ));
                    if (hit) return category;
                }

                return '🎵 Other';
            }

            createGenreMapping() {
                // canonical genre -> synonyms that mean the same thing.
                // Real subgenres (Trip-hop, Ambient, Dream pop, Bebop ...) stay
                // separate; the 8 categories group them.
                return {
                    'rock': ['rock', 'classic rock', 'soft rock', 'arena rock', 'southern rock'],
                    'pop': ['pop', 'pop rock', 'dance pop'],
                    'electronic': ['electronic', 'electronica'],
                    'hip hop': ['hip hop', 'rap', 'gangsta rap', 'conscious hip hop', 'underground hip hop',
                                'east coast hip hop', 'west coast hip hop', 'east coast rap', 'west coast rap'],
                    'deutschrap': ['deutschrap', 'german hip hop', 'deutscher hip hop', 'german rap', 'deutsch rap'],
                    'jazz': ['jazz', 'contemporary jazz', 'smooth jazz'],
                    'folk': ['folk', 'contemporary folk'],
                    'r&b': ['r&b', 'contemporary r&b'],
                    'soul': ['soul', 'classic soul', 'motown'],
                    'punk': ['punk', 'punk rock'],
                    'country': ['country', 'country rock'],
                    'classical': ['classical', 'classical music', 'orchestral', 'romantic'],
                    'modern classical': ['modern classical', 'contemporary classical'],
                    'reggae': ['reggae', 'roots reggae'],
                    'blues': ['blues', 'chicago blues', 'electric blues'],
                    'world': ['world', 'world music'],
                    'african': ['african', 'africa']
                };
            }

            // variant -> canonical, built once
            buildGenreMergeIndex() {
                const index = new Map();
                Object.entries(this.genreMapping).forEach(([canonical, variants]) =>
                    variants.forEach(v => index.set(this.normalizeGenre(v), this.normalizeGenre(canonical))));
                return index;
            }

            mapGenre(originalGenre) {
                if (!originalGenre) return 'Unknown';
                const key = this.normalizeGenre(originalGenre);
                return this.displayGenre(this.genreMergeIndex.get(key) || key);
            }

            normalizeCategoryOverrides(overrides) {
                const result = {};
                Object.entries(overrides || {}).forEach(([genre, category]) => {
                    result[this.normalizeGenre(genre)] = category;
                });
                return result;
            }

            artistKey(artist) {
                return (artist || '').toLowerCase().trim();
            }

            applyGenreOverrides(albums) {
                albums.forEach(album => {
                    const genre = this.genreOverrides[this.artistKey(album.artist)];
                    if (genre) album.genre = genre;
                });
            }

            async init() {
                // Request persistent storage (wichtig für Brave & Privacy-Browser)
                await this.requestPersistentStorage();
                
                this.showLoading('Lade gespeicherte Alben...');
                
                try {
                    // Try to load from IndexedDB
                    const savedAlbums = await this.loadFromIndexedDB();
                    
                    if (savedAlbums && savedAlbums.length > 0) {
                        this.albums = savedAlbums;
                        
                        // Re-classify in case the genre logic has changed
                        this.reclassifyAlbums(this.albums);
                        this.applyGenreOverrides(this.albums);
                        
                        // Save updated genres back to IndexedDB
                        await this.saveToIndexedDB();
                        
                        this.renderAlbumsByGenre();
                    } else {
                        this.showUploadScreen();
                    }
                } catch (error) {
                    console.error('Fehler beim Laden:', error);
                    this.showUploadScreen();
                }
            }

            // IndexedDB Helper Methods
            async openDB() {
                return new Promise((resolve, reject) => {
                    const request = indexedDB.open('RecordShelfDB', 1);
                    
                    request.onerror = () => reject(request.error);
                    request.onsuccess = () => resolve(request.result);
                    
                    request.onupgradeneeded = (event) => {
                        const db = event.target.result;
                        if (!db.objectStoreNames.contains('albums')) {
                            db.createObjectStore('albums', { keyPath: 'id' });
                        }
                    };
                });
            }

            async loadFromIndexedDB() {
                try {
                    const db = await this.openDB();
                    const transaction = db.transaction(['albums'], 'readonly');
                    const store = transaction.objectStore('albums');
                    const request = store.get('albumLibrary');
                    
                    return new Promise((resolve, reject) => {
                        request.onsuccess = () => {
                            if (request.result) {
                                // Load categoryOrder if available
                                if (request.result.categoryOrder) {
                                    this.categoryOrder = request.result.categoryOrder;
                                }
                                this.genreOverrides = request.result.genreOverrides || {};
                                this.artistTags = request.result.artistTags || {};
                                this.categoryOverrides = this.normalizeCategoryOverrides(request.result.categoryOverrides);
                                resolve(request.result.albums || null);
                            } else {
                                resolve(null);
                            }
                        };
                        request.onerror = () => {
                            console.error('Fehler beim Laden aus IndexedDB:', request.error);
                            reject(request.error);
                        };
                    });
                } catch (error) {
                    console.error('Fehler beim Öffnen der IndexedDB:', error);
                    return null;
                }
            }

            async saveToIndexedDB() {
                try {
                    const db = await this.openDB();
                    const transaction = db.transaction(['albums'], 'readwrite');
                    const store = transaction.objectStore('albums');
                    
                    const data = {
                        id: 'albumLibrary',
                        albums: this.albums,
                        categoryOrder: this.categoryOrder,
                        genreOverrides: this.genreOverrides,
                        categoryOverrides: this.categoryOverrides,
                        artistTags: this.artistTags,
                        savedAt: new Date().toISOString()
                    };
                    
                    store.put(data);
                    
                    return new Promise((resolve, reject) => {
                        transaction.oncomplete = () => {
                            resolve();
                        };
                        transaction.onerror = () => {
                            console.error('Fehler beim Speichern in IndexedDB:', transaction.error);
                            reject(transaction.error);
                        };
                    });
                } catch (error) {
                    console.error('Fehler beim Speichern in IndexedDB:', error);
                }
            }

            async requestPersistentStorage() {
                if (navigator.storage && navigator.storage.persist) {
                    try {
                        // Check if already granted
                        const isPersisted = await navigator.storage.persisted();
                        
                        if (isPersisted) {
                            return true;
                        }
                        
                        // Request persistence
                        const granted = await navigator.storage.persist();
                        
                        if (granted) {
                            console.log('✅ Persistent Storage aktiviert! Daten bleiben erhalten.');
                        } else {
                            console.log('⚠️ Persistent Storage nicht gewährt. Browser könnte Daten löschen.');
                        }
                        
                        return granted;
                    } catch (error) {
                        console.error('Fehler bei Storage Persistence Request:', error);
                        return false;
                    }
                } else {
                    console.log('ℹ️ Storage Persistence API nicht verfügbar (älterer Browser)');
                    return false;
                }
            }

            setupDragAndDrop() {
                const list = document.getElementById('categoryList');
                const items = list.querySelectorAll('.category-item');
                let draggedElement = null;
                let touchY = 0;

                items.forEach(item => {
                    // Desktop: HTML5 Drag & Drop
                    item.addEventListener('dragstart', (e) => {
                        draggedElement = item;
                        item.classList.add('dragging');
                    });

                    item.addEventListener('dragend', (e) => {
                        item.classList.remove('dragging');
                    });

                    item.addEventListener('dragover', (e) => {
                        e.preventDefault();
                        const afterElement = this.getDragAfterElement(list, e.clientY);
                        if (afterElement == null) {
                            list.appendChild(draggedElement);
                        } else {
                            list.insertBefore(draggedElement, afterElement);
                        }
                    });

                    // Mobile: Touch Events
                    item.addEventListener('touchstart', (e) => {
                        draggedElement = item;
                        touchY = e.touches[0].clientY;
                        item.classList.add('dragging');
                        item.style.opacity = '0.5';
                    }, { passive: false });

                    item.addEventListener('touchmove', (e) => {
                        e.preventDefault();
                        touchY = e.touches[0].clientY;
                        
                        const afterElement = this.getDragAfterElement(list, touchY);
                        if (afterElement == null) {
                            list.appendChild(draggedElement);
                        } else {
                            list.insertBefore(draggedElement, afterElement);
                        }
                    }, { passive: false });

                    item.addEventListener('touchend', (e) => {
                        item.classList.remove('dragging');
                        item.style.opacity = '1';
                        draggedElement = null;
                    });
                });
            }

            getDragAfterElement(container, y) {
                const draggableElements = [...container.querySelectorAll('.category-item:not(.dragging)')];

                return draggableElements.reduce((closest, child) => {
                    const box = child.getBoundingClientRect();
                    const offset = y - box.top - box.height / 2;

                    if (offset < 0 && offset > closest.offset) {
                        return { offset: offset, element: child };
                    } else {
                        return closest;
                    }
                }, { offset: Number.NEGATIVE_INFINITY }).element;
            }

            handleFile(file) {
                if (!file.name.endsWith('.csv')) {
                    this.showError('Bitte wähle eine CSV-Datei aus.');
                    return;
                }

                this.showLoading();

                Papa.parse(file, {
                    header: true,
                    skipEmptyLines: true,
                    complete: (results) => {
                        this.processCSV(results.data);
                    },
                    error: (error) => {
                        this.showError('Fehler beim Lesen der CSV: ' + error.message);
                    }
                });
            }

            processCSV(data) {
                if (data.length === 0) {
                    this.showError('Die CSV-Datei ist leer.');
                    return;
                }

                // Helper function to get value from row with flexible column names
                const getColumnValue = (row, ...possibleNames) => {
                    for (const name of possibleNames) {
                        if (row[name] !== undefined && row[name] !== null && row[name] !== '') {
                            return row[name];
                        }
                    }
                    return null;
                };

                // Check for required columns (flexible matching)
                const firstRow = data[0];
                const albumValue = getColumnValue(firstRow, 'Album', 'album', 'ALBUM');
                const artistValue = getColumnValue(firstRow, 'Artist name', 'Artist', 'artist', 'ARTIST', 'Artist Name');
                
                if (!albumValue || !artistValue) {
                    this.showError('Die CSV muss Album- und Künstler-Spalten enthalten.');
                    return;
                }

                const imported = data.filter(row => {
                    const album = getColumnValue(row, 'Album', 'album', 'ALBUM');
                    const artist = getColumnValue(row, 'Artist name', 'Artist', 'artist', 'ARTIST', 'Artist Name');
                    return album && artist;
                }).map(row => {
                    const album = {
                        album: getColumnValue(row, 'Album', 'album', 'ALBUM'),
                        artist: getColumnValue(row, 'Artist name', 'Artist', 'artist', 'ARTIST', 'Artist Name')
                    };
                    
                    // Check for optional tidal_id or tidal_url column (flexible matching)
                    const tidalId = getColumnValue(row, 'Tidal - id', 'Tidal-id', 'tidal_id', 'tidal-id', 'Tidal_id', 'Tidal_ID', 'TIDAL_ID', 'tidalId', 'TidalId');
                    const tidalUrl = getColumnValue(row, 'Tidal - url', 'Tidal-url', 'tidal_url', 'tidal-url', 'Tidal_url', 'TIDAL_URL', 'tidalUrl', 'TidalUrl');
                    
                    if (tidalId) {
                        album.tidalId = tidalId;
                    } else if (tidalUrl) {
                        // Extract ID from URL like https://tidal.com/album/123456
                        const match = tidalUrl.match(/album[\/:](\d+)/);
                        if (match) {
                            album.tidalId = match[1];
                        }
                    }
                    
                    return album;
                });

                // Keep genre and cover of albums that are already in the library
                const albumKey = a => `${a.artist}|${a.album}`.toLowerCase().trim();
                const known = new Map(this.albums.map(a => [albumKey(a), a]));
                imported.forEach(album => {
                    const old = known.get(albumKey(album));
                    if (old) {
                        if (old.genre && old.genre !== 'Unknown') album.genre = old.genre;
                        if (old.coverUrl) album.coverUrl = old.coverUrl;
                    }
                });
                this.applyGenreOverrides(imported);

                this.showLoading('Lade Genres und Cover...');
                this.loadAllAlbumData(imported);
            }

            async loadAllAlbumData(imported) {
                try {
                    // Only albums with missing genre or cover need Last.fm
                    const todo = imported.filter(a => !a.genre || a.genre === 'Unknown' || !a.coverUrl);
                    const total = todo.length;
                    const batchSize = 2; // Last.fm allows about 5 requests per second
                    const delayBetweenBatches = 500;
                    
                    let processed = 0;
                    
                    for (let i = 0; i < todo.length; i += batchSize) {
                        const batch = todo.slice(i, i + batchSize);
                        
                        await Promise.all(batch.map(async (album) => {
                            if (!album.genre || album.genre === 'Unknown') {
                                album.genre = await this.fetchGenreFromLastFM(album.artist) || 'Unknown';
                            }
                            if (!album.coverUrl) {
                                album.coverUrl = await this.fetchAlbumCover(album.album, album.artist);
                            }
                            processed++;
                            this.showLoading(`Lade Album-Daten von Last.fm...`, processed, total);
                        }));
                        
                        if (i + batchSize < todo.length) {
                            await this.sleep(delayBetweenBatches);
                        }
                    }

                    // Replace the library only after everything is loaded
                    this.albums = imported;
                    await this.saveToIndexedDB();
                    
                    // Auto-create backup after successful import
                    this.autoExportBackup();
                    
                    // Now render grouped by genre
                    this.renderAlbumsByGenre();
                } catch (error) {
                    console.error('Fehler beim Laden der Daten:', error);
                    this.showError('Fehler beim Laden der Daten: ' + error.message);
                }
            }

            // Last.fm request with up to 3 attempts on network errors,
            // rate limits (29) and temporary errors (8, 11, 16)
            async lastfmRequest(params) {
                const query = new URLSearchParams({ ...params, api_key: this.LASTFM_API_KEY, format: 'json' });
                const url = `https://ws.audioscrobbler.com/2.0/?${query}`;
                for (let attempt = 1; ; attempt++) {
                    try {
                        const response = await fetch(url);
                        const data = await response.json();
                        if ([8, 11, 16, 29].includes(data.error)) {
                            throw new Error(`Last.fm Fehler ${data.error}: ${data.message}`);
                        }
                        return data;
                    } catch (error) {
                        if (attempt === 3) throw error;
                        await this.sleep(2000 * attempt);
                    }
                }
            }

            async fetchAlbumCover(albumName, artistName) {
                try {
                    const data = await this.lastfmRequest({ method: 'album.getinfo', artist: artistName, album: albumName });

                    if (data.album && data.album.image) {
                        const images = data.album.image;
                        const largeImage = images.find(img => img.size === 'extralarge') || 
                                         images.find(img => img.size === 'large') ||
                                         images[images.length - 1];
                        
                        if (largeImage && largeImage['#text']) {
                            return largeImage['#text'];
                        }
                    }
                    return null;
                } catch (error) {
                    console.error('Error loading cover:', error);
                    return null;
                }
            }

            importBackup(event) {
                const file = event.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                
                reader.onload = async (e) => {
                    try {
                        const backup = JSON.parse(e.target.result);
                        
                        // Validate backup structure
                        if (!backup.albums || !Array.isArray(backup.albums)) {
                            throw new Error('Ungültiges Backup-Format');
                        }

                        // Confirm restore
                        const message = `Backup vom ${new Date(backup.exportDate).toLocaleDateString()}\n` +
                                      `${backup.albumCount} Alben\n\n` +
                                      `Aktuelle Daten überschreiben?`;
                        
                        if (!confirm(message)) {
                            event.target.value = ''; // Reset file input
                            return;
                        }

                        // Restore albums
                        this.albums = backup.albums;
                        // Backups before v1.4.7 have no overrides: keep the current ones
                        if (backup.genreOverrides) this.genreOverrides = backup.genreOverrides;
                        if (backup.categoryOverrides) this.categoryOverrides = this.normalizeCategoryOverrides(backup.categoryOverrides);
                        if (backup.artistTags) this.artistTags = backup.artistTags;
                        this.reclassifyAlbums(this.albums);
                        this.applyGenreOverrides(this.albums);
                        
                        // Save to IndexedDB
                        await this.saveToIndexedDB();
                        
                        // Re-render
                        this.renderAlbumsByGenre();
                        
                        
                        // Reset file input
                        event.target.value = '';
                        
                    } catch (error) {
                        console.error('Fehler beim Importieren:', error);
                        alert('Fehler beim Laden des Backups: ' + error.message);
                        event.target.value = '';
                    }
                };
                
                reader.readAsText(file);
            }

            openInTidal(deepLink, webLink, hasTidalId, tidalId) {
                
                if (hasTidalId) {
                    // Try to detect if app opens
                    let appOpened = false;
                    
                    const handleVisibilityChange = () => {
                        if (document.hidden) {
                            appOpened = true;
                        }
                    };
                    
                    const handleBlur = () => {
                        appOpened = true;
                    };
                    
                    document.addEventListener('visibilitychange', handleVisibilityChange);
                    window.addEventListener('blur', handleBlur);
                    
                    // Try play deep link for mobile app
                    const playLink = `tidal://play/album/${tidalId}`;
                    window.location.href = playLink;
                    
                    // Check after 2 seconds if app opened
                    setTimeout(() => {
                        document.removeEventListener('visibilitychange', handleVisibilityChange);
                        window.removeEventListener('blur', handleBlur);
                        
                        if (!appOpened) {
                            console.log('App nicht installiert, öffne Web Player');
                            window.open(webLink, '_blank');
                        } else {
                            console.log('App geöffnet, kein Web Player nötig');
                        }
                    }, 2000);
                } else {
                    // No Tidal ID - open search in both app and web
                    let appOpened = false;
                    
                    const handleVisibilityChange = () => {
                        if (document.hidden) appOpened = true;
                    };
                    
                    const handleBlur = () => {
                        appOpened = true;
                    };
                    
                    document.addEventListener('visibilitychange', handleVisibilityChange);
                    window.addEventListener('blur', handleBlur);
                    
                    window.location.href = deepLink;
                    
                    setTimeout(() => {
                        document.removeEventListener('visibilitychange', handleVisibilityChange);
                        window.removeEventListener('blur', handleBlur);
                        
                        if (!appOpened) {
                            window.open(webLink, '_blank');
                        }
                    }, 1500);
                }
            }

            createTagBlacklist() {
                // Tags that describe something other than a genre
                return new Set([
                    // Nationalities
                    'french', 'german', 'british', 'american', 'canadian', 'australian',
                    'japanese', 'korean', 'swedish', 'norwegian', 'finnish', 'danish', 'kenya',
                    'italian', 'spanish', 'dutch', 'belgian', 'austrian', 'swiss',
                    'irish', 'scottish', 'welsh', 'icelandic', 'portuguese', 'austria', 'bayrisch', 'pakistan', 'peru',
                    'usa', 'ukrainian', 'ukranian',
                    // Cities/Places
                    'london', 'berlin', 'paris', 'new york', 'los angeles', 'tokyo',
                    'nyc', 'la', 'uk', 'europe', 'united states',
                    // Decades
                    '60s', '70s', '80s', '90s', '2000s', '2010s', '00s', '10s',
                    // Non-descriptive
                    'seen live', 'favorite', 'favorites', 'favourite', 'favourites',
                    'love', 'loved', 'awesome', 'beautiful', 'amazing',
                    // Genders
                    'female', 'male', 'female vocalists', 'male vocalists',
                    'female vocalist', 'male vocalist',
                    // Vague descriptors
                    'melancholic', 'melancholy', 'chill', 'atmospheric', 'cello',
                    'dischord', 'guitar', 'instrumental', 'outsider', 'touhou', 'political'
                ].map(tag => this.normalizeGenre(tag)));
            }

            // Pick a genre from an artist's top tags: the first of the top 6 tags
            // that maps to one of the 8 categories; otherwise the first tag that
            // is not blacklisted.
            classifyTags(tags) {
                const candidates = (tags || []).filter(tag => !this.tagBlacklist.has(this.normalizeGenre(tag)));
                for (const tag of candidates.slice(0, 6)) {
                    const genre = this.mapGenre(tag);
                    if (this.getMainCategory(genre, false) !== '🎵 Other') return genre;
                }
                if (candidates.length > 0) return this.mapGenre(candidates[0]);
                return tags && tags.length > 0 ? this.mapGenre(tags[0]) : 'Unknown';
            }

            // Genre from stored tags if available, otherwise re-map the stored genre
            reclassifyAlbums(albums) {
                albums.forEach(album => {
                    const tags = this.artistTags[this.artistKey(album.artist)];
                    if (tags && tags.length > 0) {
                        album.genre = this.classifyTags(tags);
                    } else if (album.genre) {
                        album.genre = this.mapGenre(album.genre);
                    }
                });
            }

            async fetchGenreFromLastFM(artist, forceRequest = false) {
                const key = this.artistKey(artist);
                if (!forceRequest && this.artistTags[key]) {
                    return this.classifyTags(this.artistTags[key]);
                }

                try {
                    const data = await this.lastfmRequest({ method: 'artist.gettoptags', artist });
                    const tags = (data.toptags?.tag || []).slice(0, 10)
                        .map(tag => tag.name.toLowerCase().trim());
                    if (tags.length === 0) return null; // unknown at Last.fm: caller keeps the old genre
                    this.artistTags[key] = tags;
                    const genre = this.classifyTags(tags);
                    console.log(`Genre für ${artist}: ${genre} (Tags: ${tags.slice(0, 6).join(', ')})`);
                    return genre;
                } catch (error) {
                    console.error('Error fetching genre:', error);
                    return null; // request failed: caller keeps the old genre
                }
            }

            async redetermineGenres() {
                const artists = [...new Set(this.albums.map(a => a.artist))];
                const minutes = Math.max(1, Math.round(artists.length / 120));
                const ok = confirm(
                    `Alle ${artists.length} Künstler werden neu bei Last.fm abgefragt (ca. ${minutes} Min.).\n\n` +
                    `Vorher wird automatisch ein Backup heruntergeladen.\n` +
                    `Deine Korrekturen von Hand bleiben erhalten.\n\nFortfahren?`
                );
                if (!ok) return;

                this.downloadBackup();

                let processed = 0;
                let failed = 0;
                const newGenres = new Map();
                for (let i = 0; i < artists.length; i += 2) {
                    await Promise.all(artists.slice(i, i + 2).map(async artist => {
                        const genre = await this.fetchGenreFromLastFM(artist, true);
                        if (genre) newGenres.set(this.artistKey(artist), genre);
                        else failed++;
                        processed++;
                        this.showLoading('Bestimme Genres neu...', processed, artists.length);
                    }));
                    if (i + 2 < artists.length) await this.sleep(500);
                }

                this.albums.forEach(album => {
                    const genre = newGenres.get(this.artistKey(album.artist));
                    if (genre) album.genre = genre;
                });
                this.applyGenreOverrides(this.albums);
                await this.saveToIndexedDB();
                this.renderAlbumsByGenre();
                this.showToast(failed
                    ? `⚠️ Genres neu bestimmt; ${failed} Künstler nicht gefunden, dort bleibt das alte Genre`
                    : '✅ Genres neu bestimmt');
            }

            showLoading(message = 'Verarbeite CSV-Datei...', current = 0, total = 0) {

                    ? `<div style="margin-top: 10px; font-size: 1.2rem; font-weight: 600; color: var(--accent);">${current} / ${total}</div>`

                const progressBar = (current > 0 && total > 0)

                        <div style="height: 100%; background: var(--accent); width: ${(current/total*100)}%; transition: width 0.3s ease;"></div>
                       </div>`
                    : '';
                
                document.getElementById('app').innerHTML = `
                    <div class="loading">
                        <div class="spinner"></div>
                        <p>${message}</p>
                        ${progressText}
                        ${progressBar}
                    </div>
                `;
            }

            showGenreDialog(artist) {

                const current = artistAlbums[0]?.genre || 'Unknown';
                const hasOverride = !!this.genreOverrides[key];
                const genres = [...new Set(this.albums.map(a => a.genre).filter(Boolean))]
                    .sort((a, b) => a.localeCompare(b, 'de'));

                const overlay = document.createElement('div');
                overlay.className = 'genre-dialog-overlay';
                overlay.innerHTML = `
                    <div class="genre-dialog">
                        <h2>Genre für ${this.escapeHtml(artist)}</h2>
                        <p>Gilt für ${artistAlbums.length === 1 ? 'alle Alben' : `alle ${artistAlbums.length} Alben`} dieses Künstlers,
                           auch künftige, und bleibt bei jedem Import erhalten.</p>
                        <label for="genreSelect">Vorhandenes Genre</label>
                        <select id="genreSelect">
                            ${genres.map(g => `<option value="${this.escapeAttr(g)}" ${g === current ? 'selected' : ''}>${this.escapeHtml(g)}</option>`).join('')}
                        </select>
                        <label for="genreInput">Oder neues Genre</label>
                        <input id="genreInput" type="text" placeholder="z. B. Krautrock" autocomplete="off">
                        <label for="categorySelect">Kategorie für dieses Genre</label>
                        <select id="categorySelect">
                            <option value="auto">Automatisch</option>
                            ${Object.keys(this.mainCategories).map(c => `<option value="${this.escapeAttr(c)}">${this.escapeHtml(c)}</option>`).join('')}
                        </select>
                        <p class="genre-dialog-hint" id="categoryHint"></p>
                        <div class="settings-actions">
                            ${hasOverride ? '<button class="btn-secondary" data-action="reset">Last.fm-Genre</button>' : ''}
                            <button class="btn-secondary" data-action="cancel">Abbrechen</button>
                            <button class="btn-primary" data-action="save">Speichern</button>
                        </div>
                    </div>
                `;
                document.body.appendChild(overlay);

                // Category select follows the chosen genre
                const genreSelect = overlay.querySelector('#genreSelect');
                const genreInput = overlay.querySelector('#genreInput');
                const categorySelect = overlay.querySelector('#categorySelect');
                const categoryHint = overlay.querySelector('#categoryHint');
                const chosenGenre = () => {
                    const typed = genreInput.value.trim();
                    return typed ? typed.charAt(0).toUpperCase() + typed.slice(1) : genreSelect.value;
                };
                const updateCategory = () => {
                    const genre = chosenGenre();
                    categorySelect.value = this.categoryOverrides[this.normalizeGenre(genre)] || 'auto';
                    updateHint();
                };
                const updateHint = () => {
                    const genre = chosenGenre();
                    if (categorySelect.value !== 'auto') {
                        categoryHint.textContent = `Gilt für alle Alben mit dem Genre „${genre}“.`;
                    } else {
                        categoryHint.textContent = `Automatisch: ${this.getMainCategory(genre, false)}`;
                    }
                };
                genreSelect.addEventListener('change', updateCategory);
                genreInput.addEventListener('input', updateCategory);
                categorySelect.addEventListener('change', updateHint);
                updateCategory();

                const close = () => overlay.remove();
                overlay.addEventListener('click', async (e) => {
                    const action = e.target.dataset.action;
                    if (e.target === overlay || action === 'cancel') return close();
                    if (action === 'save') {
                        const genre = chosenGenre();
                        const category = categorySelect.value;
                        close();
                        if (genre) await this.setGenreOverride(artist, genre, category);
                    }
                    if (action === 'reset') {
                        close();
                        await this.setGenreOverride(artist, null);
                    }
                });
            }

            async setGenreOverride(artist, genre, category) {
                const key = this.artistKey(artist);
                const currentGenre = this.albums.find(a => this.artistKey(a.artist) === key)?.genre;
                if (genre) {
                    // Only pin the artist's genre if it actually changes
                    if (genre !== currentGenre) this.genreOverrides[key] = genre;
                    if (category === 'auto') delete this.categoryOverrides[this.normalizeGenre(genre)];
                    else if (category) this.categoryOverrides[this.normalizeGenre(genre)] = category;
                } else {
                    // Back to the Last.fm genre
                    delete this.genreOverrides[key];
                    genre = await this.fetchGenreFromLastFM(artist) || 'Unknown';
                }
                this.albums.forEach(album => {
                    if (this.artistKey(album.artist) === key) album.genre = genre;
                });
                await this.saveToIndexedDB();

                // Re-render (collapsed state is remembered), keep scroll position
                const scrollY = window.scrollY;
                this.renderAlbumsByGenre();
                window.scrollTo(0, scrollY);
                this.showToast(`✅ ${artist}: ${genre} → ${this.getMainCategory(genre)}`);
            }

            sleep(ms) {
                return new Promise(resolve => setTimeout(resolve, ms));
            }
        }

        // Initialize app
        const app = new AlbumLibraryApp();
        app.init();
    </script>
</body>
</html>
